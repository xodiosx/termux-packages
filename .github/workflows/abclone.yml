name: Build XoDos Patched Termux Debs

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: "Release tag prefix"
        required: false
        default: "xodos"
      arch:
        description: "Space-separated arches to keep (aarch64 arm i686 x86_64 all). Empty = all."
        required: false
        default: "aarch64"
      max_debs:
        description: "Max debs per repo (0 = all). Use 30 for a smoke test."
        required: false
        default: "0"
      skip:
        description: "Space-separated repos to skip (main x11 root tur tur-on-device tur-continuous)"
        required: false
        default: ""
      workers:
        description: "Parallel download+patch workers (6 recommended)"
        required: false
        default: "6"
      upload_delay:
        description: "Seconds between upload batches (0.15 fast, 0.5 safe, 1.0 very safe)"
        required: false
        default: "0.5"
      upload_batch:
        description: "Files per bulk-upload batch (1 = one-by-one, 20 = recommended)"
        required: false
        default: "20"
      strict:
        description: "Fail the job if any deb could not be patched"
        type: boolean
        default: false
      keep_tmp:
        description: "Keep extracted trees on pack failure (for debugging)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-xodos-debs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # Termux official repos: classic Debian pool layout
          - name: main
            packages_url: "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages"
            base_url:     "https://packages-cf.termux.dev/apt/termux-main/"
            release_prefix: XoDos-main

          - name: x11
            packages_url: "https://packages-cf.termux.dev/apt/termux-x11/dists/x11/main/binary-aarch64/Packages"
            base_url:     "https://packages-cf.termux.dev/apt/termux-x11/"
            release_prefix: XoDos-x11

          - name: root
            packages_url: "https://packages-cf.termux.dev/apt/termux-root/dists/root/stable/binary-aarch64/Packages"
            base_url:     "https://packages-cf.termux.dev/apt/termux-root/"
            release_prefix: XoDos-root

          # TUR: metadata on tur.kcubeterm.com, .deb on GitHub Releases (absolute Filename: URLs)
          - name: tur
            packages_url: "https://tur.kcubeterm.com/dists/tur-packages/tur/binary-aarch64/Packages"
            base_url:     "https://tur.kcubeterm.com/"
            release_prefix: XoDos-tur

          - name: tur-on-device
            packages_url: "https://tur.kcubeterm.com/dists/tur-packages/tur-on-device/binary-aarch64/Packages"
            base_url:     "https://tur.kcubeterm.com/"
            release_prefix: XoDos-tur-on-device

          - name: tur-continuous
            packages_url: "https://tur.kcubeterm.com/dists/tur-packages/tur-continuous/binary-aarch64/Packages"
            base_url:     "https://tur.kcubeterm.com/"
            release_prefix: XoDos-tur-continuous

          # Optional: glibc if you host your own mirror later
          # - name: glibc
          #   packages_url: "https://<host>/dists/glibc/main/binary-aarch64/Packages"
          #   base_url:     "https://<host>/"
          #   release_prefix: XoDos-glibc

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PACKAGES_URL: ${{ matrix.packages_url }}
      BASE_URL: ${{ matrix.base_url }}
      REL_PREFIX: ${{ matrix.release_prefix }}
      REPO_NAME: ${{ matrix.name }}
      TAG_PREFIX: ${{ inputs.tag_prefix }}
      ARCH_IN: ${{ inputs.arch }}
      MAX_DEBS: ${{ inputs.max_debs }}
      SKIP_LIST: ${{ inputs.skip }}
      WORKERS: ${{ inputs.workers }}
      UPLOAD_DELAY: ${{ inputs.upload_delay }}
      UPLOAD_BATCH: ${{ inputs.upload_batch }}
      STRICT: ${{ inputs.strict && '1' || '0' }}
      KEEP_TMP: ${{ inputs.keep_tmp && '1' || '0' }}

    steps:
      - name: Skip check
        id: skipcheck
        run: |
          set -euo pipefail
          for s in $SKIP_LIST; do
            [ "$s" = "$REPO_NAME" ] && { echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.skipcheck.outputs.skip == 'false'

      - name: Install tools
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils xz-utils zstd dpkg-dev perl curl ca-certificates

      - name: Verify Packages URL
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$PACKAGES_URL" || echo "000")
          echo ">>> ${PACKAGES_URL} -> HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Packages URL returned HTTP ${code} for '$REPO_NAME'"
            exit 1
          fi

      - name: Disk space (pre)
        if: steps.skipcheck.outputs.skip == 'false'
        run: df -h /

      # ==========================================================
      # STAGE 1 — fetch Packages file, extract .deb URLs
      # ==========================================================
      - name: Extract .deb URLs from Packages
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p work

          echo ">>> fetching $PACKAGES_URL"
          curl -fsSL --retry 4 --retry-delay 2 --max-time 120 \
            -o work/Packages "$PACKAGES_URL" \
            || { echo "::error::cannot fetch Packages file"; exit 1; }

          size=$(wc -c < work/Packages)
          echo ">>> Packages size: ${size} bytes"

          # Extract Filename: entries, one per line
          # Termux: relative paths like "pool/main/a/apt/apt_2.8.1-2_aarch64.deb"
          # TUR:    absolute URLs like "https://github.com/.../file.deb"
          grep -E '^Filename:' work/Packages \
            | sed 's/^Filename:[[:space:]]*//' \
            | sed 's/[[:space:]]*$//' \
            > work/filenames-raw.txt

          raw_total=$(wc -l < work/filenames-raw.txt)
          echo ">>> total Filename entries: $raw_total"

          if [ "$raw_total" -eq 0 ]; then
            echo "::error::No Filename entries in Packages"
            head -30 work/Packages || true
            exit 1
          fi

          # Convert to absolute URLs where needed.
          # - entries starting with "http" are left as-is (TUR)
          # - relative entries are prepended with BASE_URL
          : > work/urls-all.txt
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            case "$entry" in
              http://*|https://*) printf '%s\n' "$entry" >> work/urls-all.txt ;;
              /*) printf '%s%s\n' "${BASE_URL%/}" "$entry" >> work/urls-all.txt ;;
              *)  printf '%s/%s\n' "${BASE_URL%/}" "$entry" >> work/urls-all.txt ;;
            esac
          done < work/filenames-raw.txt

          sort -u work/urls-all.txt > work/urls-all-sorted.txt
          all_total=$(wc -l < work/urls-all-sorted.txt)
          echo ">>> unique URLs: $all_total"

          # ---------------- ARCH FILTER ----------------
          if [ -z "${ARCH_IN// /}" ]; then
            echo ">>> arch filter: none (all archs)"
            cp work/urls-all-sorted.txt work/urls-filtered.txt
          else
            echo ">>> arch filter: [$ARCH_IN]"
            alt=""
            need_all=1
            for a in $ARCH_IN; do
              [ "$a" = "all" ] && { need_all=0; }
              if [ -z "$alt" ]; then alt="$a"; else alt="$alt|$a"; fi
            done
            [ "$need_all" = "1" ] && alt="$alt|all"
            grep -E "_(${alt})\.deb$" work/urls-all-sorted.txt > work/urls-filtered.txt || true
          fi

          filt_total=$(wc -l < work/urls-filtered.txt)
          echo ">>> after arch filter: $filt_total / $all_total"

          if [ "$filt_total" -eq 0 ]; then
            echo "::error::Arch filter [${ARCH_IN}] removed all debs"
            echo ">>> sample of discovered names:"
            head -10 work/urls-all-sorted.txt
            exit 1
          fi

          if [ "$MAX_DEBS" != "0" ] && [ -n "$MAX_DEBS" ]; then
            head -n "$MAX_DEBS" work/urls-filtered.txt > work/urls.txt
            echo ">>> limited to first $MAX_DEBS"
          else
            cp work/urls-filtered.txt work/urls.txt
          fi

          echo ">>> first 5 URLs:"
          head -5 work/urls.txt

      # ==========================================================
      # STAGE 2 — DOWNLOAD + PATCH
      # ==========================================================
      - name: Download + patch
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p work/patched work/tmp
          : > work/failures.log
          : > work/outcomes.log

          cat > /tmp/patch_one.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail

          src="$1"; dst="$2"
          tmp="$(mktemp -d)"
          keep="${KEEP_TMP:-0}"

          cleanup() {
            local rc=$?
            if [ "$rc" -ne 0 ] && [ "$keep" = "1" ]; then
              echo "KEEP-TMP: $tmp  (rc=$rc)" >&2
            else
              rm -rf "$tmp"
            fi
          }
          trap cleanup EXIT

          if [ -e "$dst" ]; then
            if dpkg-deb -I "$dst" >/dev/null 2>&1; then
              echo "OK-CACHED"
              exit 0
            fi
            rm -f "$dst"
          fi

          if ! dpkg-deb -R "$src" "$tmp" 2>/dev/null; then
            cp -a "$src" "$dst"
            echo "FAIL-EXTRACT"
            exit 0
          fi

          # 1) Rename top-level data dir
          [ -d "$tmp/data/data/com.termux" ] && \
            mv "$tmp/data/data/com.termux" "$tmp/data/data/app.xodos2"

          # 2) Rewrite symlink targets
          while IFS= read -r -d '' link; do
            t="$(readlink "$link" 2>/dev/null || true)"
            case "$t" in
              *com.termux*) ln -sfn "${t//com.termux/app.xodos2}" "$link" || true ;;
            esac
          done < <(find "$tmp" -type l -print0 2>/dev/null || true)

          # 3) Byte-level replacement (skip compressed; skip files without pattern)
          while IFS= read -r -d '' f; do
            case "$f" in
              *.gz|*.xz|*.zst|*.bz2|*.lz4|*.lzma|*.zip|*.jar|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico) continue ;;
            esac
            if grep -qa 'com\.termux' "$f" 2>/dev/null; then
              perl -0777 -i -pe 's{com\.termux}{app.xodos2}g' "$f" 2>/dev/null || true
            fi
          done < <(find "$tmp" -type f -print0 2>/dev/null || true)

          # 4) Restore maintainer script permissions
          if [ -d "$tmp/DEBIAN" ]; then
            for s in preinst postinst prerm postrm config; do
              [ -f "$tmp/DEBIAN/$s" ] && chmod 0755 "$tmp/DEBIAN/$s" || true
            done
            for s in control conffiles md5sums shlibs symbols templates triggers; do
              [ -f "$tmp/DEBIAN/$s" ] && chmod 0644 "$tmp/DEBIAN/$s" || true
            done
          fi

          # 5) Drop conffiles entries pointing at non-existent files
          if [ -f "$tmp/DEBIAN/conffiles" ]; then
            : > "$tmp/DEBIAN/conffiles.new"
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in
                ""|\#*) printf '%s\n' "$line" >> "$tmp/DEBIAN/conffiles.new"; continue ;;
              esac
              rel="${line#/}"
              if [ -e "$tmp/$rel" ] || [ -L "$tmp/$rel" ]; then
                printf '%s\n' "$line" >> "$tmp/DEBIAN/conffiles.new"
              fi
            done < "$tmp/DEBIAN/conffiles"
            mv "$tmp/DEBIAN/conffiles.new" "$tmp/DEBIAN/conffiles"
          fi

          # 6) Ensure u+rwx on data dirs
          find "$tmp/data" -type d -print0 2>/dev/null \
            | while IFS= read -r -d '' d; do
                cur="$(stat -c '%a' "$d" 2>/dev/null || echo 755)"
                if [ $((0$cur & 0700)) -ne 0700 ]; then
                  chmod u+rwx "$d" 2>/dev/null || true
                fi
              done

          # 7) Pack with fallbacks
          if dpkg-deb --root-owner-group -b "$tmp" "$dst" >/dev/null 2>&1; then echo "OK"; exit 0; fi
          rm -f "$dst"
          if dpkg-deb --root-owner-group -Zgzip -b "$tmp" "$dst" >/dev/null 2>&1; then echo "OK-FALLBACK-GZIP"; exit 0; fi
          rm -f "$dst"
          if dpkg-deb -b "$tmp" "$dst" >/dev/null 2>&1; then echo "OK-FALLBACK-NOROG"; exit 0; fi
          rm -f "$dst"
          if [ -f "$tmp/DEBIAN/conffiles" ]; then
            : > "$tmp/DEBIAN/conffiles"
            if dpkg-deb --root-owner-group -b "$tmp" "$dst" >/dev/null 2>&1; then echo "OK-FALLBACK-NOCONFFILES"; exit 0; fi
            rm -f "$dst"
          fi

          cp -a "$src" "$dst"
          echo "UNPATCHED-COPIED"
          exit 0
          EOS
          chmod +x /tmp/patch_one.sh

          cat > /tmp/dl_and_patch.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          url="$1"; outdir="$2"; tmpdir="$3"
          faillog="$4"; outcomelog="$5"

          # Filename = last path component (may contain url-encoded chars)
          enc="$(basename "$url")"
          fn="$(printf '%s' "$enc" | perl -pe 's/%([0-9A-Fa-f]{2})/chr(hex($1))/ge')"

          tmpfile="$tmpdir/$fn"
          outfile="$outdir/$fn"

          [ -s "$outfile" ] && exit 0

          curl -fsSL --retry 4 --retry-delay 2 --max-time 600 \
            -o "$tmpfile" "$url" 2>/dev/null \
            || { rm -f "$tmpfile"; echo "DL-FAIL $fn" >> "$faillog"; exit 0; }

          outcome="$(/tmp/patch_one.sh "$tmpfile" "$outfile" 2>/dev/null | tail -1 || echo "FAIL-UNKNOWN")"
          rm -f "$tmpfile"
          [ -z "$outcome" ] && outcome="OK"

          printf '%s\t%s\n' "$outcome" "$fn" >> "$outcomelog"

          if [ ! -s "$outfile" ]; then
            echo "FAIL $fn" >> "$faillog"
          fi
          exit 0
          EOS
          chmod +x /tmp/dl_and_patch.sh

          total=$(wc -l < work/urls.txt | tr -d ' ')
          echo ">>> download+patch: $total debs, $WORKERS parallel"
          echo ">>> free space before: $(df -h --output=avail / | tail -1)"

          xargs -a work/urls.txt -P "$WORKERS" -I{} \
            bash /tmp/dl_and_patch.sh {} "work/patched" "work/tmp" \
              "work/failures.log" "work/outcomes.log" \
            || true

          produced=$(find work/patched -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          echo ">>> produced debs: $produced / $total"
          echo ">>> free space after:  $(df -h --output=avail / | tail -1)"
          du -sh work/patched

          echo ">>> outcome counts:"
          if [ -s work/outcomes.log ]; then
            awk -F'\t' '{print $1}' work/outcomes.log | sort | uniq -c | sort -rn
          fi

          if [ -s work/failures.log ]; then
            nfail=$(wc -l < work/failures.log)
            echo ">>> $nfail hard failures (first 20):"
            head -20 work/failures.log
          fi

          if [ "$STRICT" = "1" ] && [ -s work/failures.log ]; then
            echo "::error::$((total - produced)) deb(s) missing (STRICT=1)"
            exit 1
          fi
          exit 0

      - name: Upload logs
        if: steps.skipcheck.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: |
            work/outcomes.log
            work/failures.log
          if-no-files-found: ignore

      # ==========================================================
      # STAGE 3 — CHUNK (≤1000 assets per release, GitHub hard cap)
      # ==========================================================
      - name: Chunk into ≤1000 assets per release
        if: steps.skipcheck.outputs.skip == 'false'
        id: chunks
        run: |
          set -euo pipefail
          cd work
          rm -rf chunks && mkdir -p chunks

          mapfile -t files < <(find patched -maxdepth 1 -name '*.deb' -printf '%f\n' | sort)
          total="${#files[@]}"
          echo ">>> patched: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::Nothing patched"
            exit 1
          fi

          chunk_idx=0; i=0
          for f in "${files[@]}"; do
            if [ $((i % 1000)) -eq 0 ]; then
              chunk_idx=$((chunk_idx + 1))
              mkdir -p "chunks/part${chunk_idx}"
            fi
            cp -a "patched/$f" "chunks/part${chunk_idx}/"
            i=$((i + 1))
          done

          nchunks=$(find chunks -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "chunks=$nchunks" >> "$GITHUB_OUTPUT"
          echo "total=$total"     >> "$GITHUB_OUTPUT"
          for d in chunks/part*; do
            echo "  $d: $(find "$d" -name '*.deb' | wc -l) files, $(du -sh "$d" | cut -f1)"
          done

      # ==========================================================
      # STAGE 4 — RELEASE + UPLOAD
      # ==========================================================
      - name: Create releases + upload
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd work
          TS=$(date -u +'%Y.%m.%d-%H%M%S')
          PFX="${TAG_PREFIX:-xodos}"
          nchunks=${{ steps.chunks.outputs.chunks }}
          total=${{ steps.chunks.outputs.total }}
          DELAY="${UPLOAD_DELAY:-0.5}"
          BATCH="${UPLOAD_BATCH:-20}"
          ARCH_LABEL="${ARCH_IN:-all}"

          echo ">>> upload delay: ${DELAY}s   batch: ${BATCH}"
          echo ">>> arch: ${ARCH_LABEL}"

          for d in chunks/part*; do
            part="${d##*part}"
            tag="${PFX}-${REL_PREFIX}-p${part}-${TS}"
            title="XoDos ${REPO_NAME} (part${part}/${nchunks}) — ${TS}"

            cat > /tmp/notes.md <<EOF
          Patched Termux \`.deb\` packages for **${REPO_NAME}**.

          - Packages index: \`${PACKAGES_URL}\`
          - Base URL: \`${BASE_URL}\`
          - Architecture filter: \`${ARCH_LABEL}\`
          - Prefix patch: \`/data/data/com.termux\` → \`/data/data/app.xodos2\`
            (tree, symlink targets, binary-safe file-content \`perl -0777\`;
            both strings are 10 bytes so ELF offsets stay valid;
            compressed blobs are skipped to avoid CRC corruption)
          - Maintainer script permissions restored to 0755
          - Non-existent conffiles entries filtered
          - Repacked with \`dpkg-deb --root-owner-group -b\`
          - Part **${part}/${nchunks}** — total produced this run: **${total}**
          - Run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

            echo ">>> creating: $tag"
            gh release create "$tag" --repo "$REPO" \
              --title "$title" --notes-file /tmp/notes.md \
              --target "${{ github.sha }}"

            mapfile -t files < <(find "$d" -maxdepth 1 -name '*.deb' -printf '%p\n' | sort)
            n="${#files[@]}"
            echo ">>> uploading $n files to $tag (batch=$BATCH delay=${DELAY}s)"
            i=0; failed=0

            while [ "$i" -lt "$n" ]; do
              batch_end=$((i + BATCH))
              [ "$batch_end" -gt "$n" ] && batch_end="$n"
              batch=( "${files[@]:i:batch_end-i}" )

              uploaded_batch=0
              for attempt in 1 2 3 4 5; do
                if gh release upload "$tag" "${batch[@]}" --repo "$REPO" --clobber \
                     2>/tmp/gh_err.log; then
                  uploaded_batch=1
                  break
                fi
                if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
                  backoff=$((attempt * 20))
                else
                  backoff=$((attempt * 4))
                fi
                echo "  batch retry $attempt in ${backoff}s…"
                sleep "$backoff"
              done

              if [ "$uploaded_batch" -eq 1 ]; then
                i="$batch_end"
                echo "  [$i/$n] uploaded (batch)"
              else
                echo "  batch failed, falling back to per-file…"
                for f in "${batch[@]}"; do
                  ok=0
                  for attempt in 1 2 3 4 5; do
                    if gh release upload "$tag" "$f" --repo "$REPO" --clobber \
                         2>/tmp/gh_err.log; then
                      ok=1; break
                    fi
                    if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
                      backoff=$((attempt * 15))
                    else
                      backoff=$((attempt * 3))
                    fi
                    sleep "$backoff"
                  done
                  if [ "$ok" -ne 1 ]; then
                    echo "  FAILED: $(basename "$f")"
                    sed -n '1,3p' /tmp/gh_err.log || true
                    failed=$((failed + 1))
                  fi
                  sleep "$DELAY"
                done
                i="$batch_end"
                echo "  [$i/$n] uploaded (fallback)"
              fi

              sleep "$DELAY"
            done

            echo ">>> $tag: $((n - failed))/${n} uploaded, failed=$failed"
            if [ "$failed" -gt 0 ]; then
              echo "::warning::$failed upload(s) failed for $tag"
            fi
          done

          exit 0

      - name: Summary
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          {
            echo "### $REPO_NAME"
            echo ""
            echo "- Packages: \`$PACKAGES_URL\`"
            echo "- Base: \`$BASE_URL\`"
            echo "- Arch filter: \`${{ inputs.arch }}\`"
            echo "- Produced debs: **${{ steps.chunks.outputs.total }}**"
            echo "- Releases created: **${{ steps.chunks.outputs.chunks }}**"
            echo "- Upload delay: \`${{ inputs.upload_delay }}s\`  ·  batch: \`${{ inputs.upload_batch }}\`"
            echo "- STRICT: \`${{ inputs.strict }}\`  ·  KEEP_TMP: \`${{ inputs.keep_tmp }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
