name: Build XoDos Patched Termux Debs

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: "Release tag prefix"
        required: false
        default: "xodos"
      max_debs:
        description: "Max debs per repo (0 = all)"
        required: false
        default: "0"
      skip:
        description: "Space-separated repos to skip (main x11 root glibc)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-xodos-debs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { name: main,  url: "https://packages-cf.termux.dev/apt/termux-main/pool/main/",    release_prefix: XoDos-main  }
          - { name: x11,   url: "https://packages-cf.termux.dev/apt/termux-x11/pool/main/",     release_prefix: XoDos-x11   }
          - { name: root,  url: "https://packages-cf.termux.dev/apt/termux-root/pool/stable/",  release_prefix: XoDos-root  }
          - { name: glibc, url: "https://packages-cf.termux.dev/apt/termux-glibc/pool/stable/", release_prefix: XoDos-glibc }

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SRC_URL: ${{ matrix.url }}
      REL_PREFIX: ${{ matrix.release_prefix }}
      REPO_NAME: ${{ matrix.name }}
      TAG_PREFIX: ${{ inputs.tag_prefix }}
      MAX_DEBS: ${{ inputs.max_debs }}
      SKIP_LIST: ${{ inputs.skip }}

    steps:
      - name: Skip check
        id: skipcheck
        run: |
          set -euo pipefail
          for s in $SKIP_LIST; do
            [ "$s" = "$REPO_NAME" ] && { echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.skipcheck.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Install tools
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils xz-utils zstd dpkg-dev perl curl ca-certificates

      # =================================================================
      # STAGE 1 — Recursive crawl (L1 = base subdirs; L2 = subdirs of L1).
      # Every failure is swallowed with `|| true` / `return 0` so a single
      # 404 never aborts the whole step.
      # =================================================================
      - name: Build .deb URL list
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p work/orig
          : > work/deblist.txt

          BASE="${SRC_URL%/}/"
          export BASE

          echo ">>> Base: $BASE"
          curl -fsSL --max-time 30 "$BASE" -o work/base.html \
            || { echo "::error::Cannot fetch $BASE"; exit 1; }

          # (a) .debs directly under base (flat layout)
          grep -oE 'href="[^"]+\.deb"' work/base.html 2>/dev/null \
            | sed -E 's|href="||;s|"$||' >> work/deblist.txt || true

          # (b) L1 = every subdir of base (char folders, libX, or direct
          #     package dirs — we don't care which, we just walk them).
          grep -oE 'href="[^"]+/"' work/base.html 2>/dev/null \
            | sed -E 's|href="||;s|/$||' \
            | grep -vE '^\.\.?$' \
            | sort -u > work/L1.txt || true

          echo ">>> L1 subdirs: $(wc -l < work/L1.txt | tr -d ' ')"

          # Emit tagged lines: DEB|<relpath> for .debs, DIR|<relpath> for subdirs.
          # NOTE: `return 0` at end + no pipefail inside -> xargs never sees 123.
          crawl_one() {
            local d="$1"
            local body
            body="$(curl -fsSL --max-time 30 "${BASE}${d}/" 2>/dev/null)" || return 0
            [ -z "$body" ] && return 0
            printf '%s\n' "$body" \
              | grep -oE 'href="[^"]+\.deb"' 2>/dev/null \
              | sed -E 's|href="||;s|"$||' \
              | while IFS= read -r fn; do printf 'DEB|%s/%s\n' "$d" "$fn"; done
            printf '%s\n' "$body" \
              | grep -oE 'href="[^"]+/"' 2>/dev/null \
              | sed -E 's|href="||;s|/$||' \
              | grep -vE '^\.\.?$' \
              | while IFS= read -r sub; do printf 'DIR|%s/%s\n' "$d" "$sub"; done
            return 0
          }
          export -f crawl_one

          echo ">>> Crawling L1…"
          # `|| true` so a nonzero xargs exit doesn't abort set -e
          xargs -a work/L1.txt -P 16 -I{} bash -c 'crawl_one "$@"' _ {} \
            > work/L1_out.txt 2>/dev/null || true

          grep '^DEB|' work/L1_out.txt 2>/dev/null | sed 's|^DEB||' >> work/deblist.txt || true
          grep '^DIR|' work/L1_out.txt 2>/dev/null | sed 's|^DIR||' | sort -u > work/L2.txt || true
          echo ">>> L2 subdirs: $(wc -l < work/L2.txt | tr -d ' ')"

          echo ">>> Crawling L2…"
          xargs -a work/L2.txt -P 20 -I{} bash -c 'crawl_one "$@"' _ {} \
            > work/L2_out.txt 2>/dev/null || true

          grep '^DEB|' work/L2_out.txt 2>/dev/null | sed 's|^DEB||' >> work/deblist.txt || true

          sort -u work/deblist.txt -o work/deblist.txt
          total=$(wc -l < work/deblist.txt | tr -d ' ')
          echo ">>> Total unique .deb URLs: $total"
          head -5 work/deblist.txt || true

          if [ "$total" -eq 0 ]; then
            echo "::error::Crawler found 0 .deb URLs at $BASE"
            echo "--- head of base index ---"
            head -40 work/base.html || true
            exit 1
          fi

          if [ "$MAX_DEBS" != "0" ] && [ -n "$MAX_DEBS" ]; then
            head -n "$MAX_DEBS" work/deblist.txt > work/deblist-ltd.txt
            mv work/deblist-ltd.txt work/deblist.txt
            echo ">>> Limited to first $MAX_DEBS"
          fi

      # =================================================================
      # STAGE 2 — Parallel download (flat into work/orig/).
      # =================================================================
      - name: Download all debs
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          BASE="${SRC_URL%/}/"
          export BASE

          dl_one() {
            local rel="$1"
            local base
            base="$(basename "$rel")"
            [ -s "work/orig/$base" ] && return 0
            if curl -fsSL --retry 3 --retry-delay 2 --max-time 300 \
                    -o "work/orig/$base.tmp" "${BASE}${rel}"; then
              mv "work/orig/$base.tmp" "work/orig/$base"
            else
              rm -f "work/orig/$base.tmp"
            fi
            return 0
          }
          export -f dl_one

          xargs -a work/deblist.txt -P 12 -I{} bash -c 'dl_one "$@"' _ {} || true

          got=$(find work/orig -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          echo ">>> Downloaded: $got .deb files"
          [ "$got" -eq 0 ] && { echo "::error::No debs downloaded"; exit 1; }
          du -sh work/orig

      # =================================================================
      # STAGE 3 — Patch every deb in place.
      #   dpkg-deb -R  ->  mv prefix tree  ->  fix symlinks  ->
      #   binary-safe perl replace  ->  dpkg-deb -b --root-owner-group
      #   com.termux == app.xodos2 (both 10 bytes) -> offset-preserving.
      # =================================================================
      - name: Patch every deb
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail

          cat > /tmp/patch_one.sh <<'EOS'
          #!/bin/bash
          set -euo pipefail
          src="$1"; dst="$2"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          dpkg-deb -R "$src" "$tmp" 2>/dev/null || { echo "SKIP -R: $(basename "$src")" >&2; exit 0; }

          # 1) rename on-disk prefix tree
          [ -d "$tmp/data/data/com.termux" ] && mv "$tmp/data/data/com.termux" "$tmp/data/data/app.xodos2"

          # 2) rewrite absolute symlink targets
          find "$tmp" -type l -print0 2>/dev/null | while IFS= read -r -d '' link; do
            t="$(readlink "$link" 2>/dev/null || true)"
            case "$t" in *com.termux*) ln -sfn "${t//com.termux/app.xodos2}" "$link" ;; esac
          done

          # 3) binary-safe content patch (same-length, ELF-safe)
          find "$tmp" -type f -exec perl -0777 -i -pe 's{com\.termux}{app.xodos2}g' {} + 2>/dev/null || true

          # 4) repack as root:root
          dpkg-deb --root-owner-group -b "$tmp" "$dst" >/dev/null 2>&1 \
            || { echo "SKIP -b: $(basename "$src")" >&2; exit 0; }
          EOS
          chmod +x /tmp/patch_one.sh

          mkdir -p work/patched
          cd work

          mapfile -t files < <(find orig -maxdepth 1 -name '*.deb' -printf '%f\n' | sort)
          total="${#files[@]}"
          echo ">>> To patch: $total"

          echo 0 > /tmp/patched.count
          : > /tmp/patched.lock

          patch_and_count() {
            base="$1"
            if /tmp/patch_one.sh "orig/$base" "patched/$base"; then
              rm -f "orig/$base"
              {
                flock 9
                n=$(cat /tmp/patched.count); n=$((n + 1)); echo "$n" > /tmp/patched.count
                [ $((n % 200)) -eq 0 ] && echo ">>> patched $n/$total" >&2
              } 9>/tmp/patched.lock
            fi
            return 0
          }
          export -f patch_and_count
          export total

          printf '%s\n' "${files[@]}" \
            | xargs -P 4 -I{} bash -c 'patch_and_count "$@"' _ {} || true

          echo ">>> DONE: patched=$(cat /tmp/patched.count) / total=$total"
          du -sh patched

      # =================================================================
      # STAGE 4 — Chunk ≤1000 assets per release.
      # =================================================================
      - name: Split into chunks
        if: steps.skipcheck.outputs.skip == 'false'
        id: chunks
        run: |
          set -euo pipefail
          cd work
          rm -rf chunks && mkdir -p chunks

          mapfile -t files < <(find patched -maxdepth 1 -name '*.deb' -printf '%f\n' | sort)
          total="${#files[@]}"
          echo ">>> Patched: $total"
          [ "$total" -eq 0 ] && { echo "::error::Nothing patched"; exit 1; }

          chunk_idx=0; i=0
          for f in "${files[@]}"; do
            if [ $((i % 1000)) -eq 0 ]; then
              chunk_idx=$((chunk_idx + 1))
              mkdir -p "chunks/part${chunk_idx}"
            fi
            cp -a "patched/$f" "chunks/part${chunk_idx}/"
            i=$((i + 1))
          done

          nchunks=$(find chunks -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "chunks=$nchunks" >> "$GITHUB_OUTPUT"
          echo "total=$total"     >> "$GITHUB_OUTPUT"
          for d in chunks/part*; do
            echo "  $d: $(find "$d" -name '*.deb' | wc -l) files, $(du -sh "$d" | cut -f1)"
          done

      # =================================================================
      # STAGE 5 — Release + upload.
      # =================================================================
      - name: Create releases + upload
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd work

          TS=$(date -u +'%Y.%m.%d-%H%M%S')
          PFX="${TAG_PREFIX:-xodos}"
          nchunks=${{ steps.chunks.outputs.chunks }}
          total=${{ steps.chunks.outputs.total }}

          for d in chunks/part*; do
            part="${d##*part}"
            tag="${PFX}-${REL_PREFIX}-p${part}-${TS}"
            title="XoDos ${REPO_NAME} (part ${part}/${nchunks}) — ${TS}"

            cat > /tmp/notes.md <<EOF
          Patched Termux \`.deb\` packages for **${REPO_NAME}**.

          - Source pool: \`${SRC_URL}\`
          - Patch: \`/data/data/com.termux\` → \`/data/data/app.xodos2\` (tree, symlink
            targets, file contents — binary-safe, offset-preserving)
          - Repacked with \`dpkg-deb --root-owner-group -b\`
          - Part **${part}/${nchunks}** — total patched this run: **${total}**
          - Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

            echo ">>> Creating release: $tag"
            gh release create "$tag" --repo "$REPO" \
              --title "$title" --notes-file /tmp/notes.md \
              --target "${{ github.sha }}"

            mapfile -t files < <(find "$d" -maxdepth 1 -name '*.deb' -printf '%p\n' | sort)
            n="${#files[@]}"
            echo ">>> Uploading $n files to $tag"
            i=0; failed=0
            for f in "${files[@]}"; do
              i=$((i + 1))
              ok=0
              for attempt in 1 2 3 4 5; do
                if gh release upload "$tag" "$f" --repo "$REPO" --clobber 2>/tmp/gh_err.log; then
                  ok=1; break
                fi
                if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
                  backoff=$((attempt * 15))
                else
                  backoff=$((attempt * 3))
                fi
                sleep "$backoff"
              done
              if [ "$ok" -eq 1 ]; then
                [ $((i % 50)) -eq 0 ] || [ "$i" -eq "$n" ] && echo "  [$i/$n] uploaded"
              else
                echo "  FAILED: $(basename "$f")"
                sed -n '1,3p' /tmp/gh_err.log || true
                failed=$((failed + 1))
              fi
              sleep 0.15
            done
            echo ">>> $tag: $((n - failed))/${n} uploaded, failed=$failed"
            [ "$failed" -gt 0 ] && echo "::warning::$failed upload(s) failed for $tag"
          done

      - name: Summary
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          {
            echo "### $REPO_NAME"
            echo ""
            echo "- Source: \`$SRC_URL\`"
            echo "- Patched debs: **${{ steps.chunks.outputs.total }}**"
            echo "- Releases created: **${{ steps.chunks.outputs.chunks }}**"
          } >> "$GITHUB_STEP_SUMMARY"
