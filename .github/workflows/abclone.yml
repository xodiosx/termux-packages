name: Build XoDos Patched Termux Debs

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: "Release tag prefix (final tag: <prefix>-<name>-p<N>-<ts>)"
        required: false
        default: "xodos"
      max_debs:
        description: "Max debs per repo (0 = all). Use small number for a test run."
        required: false
        default: "0"
      skip:
        description: "Space-separated repo names to skip (main x11 root glibc)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-xodos-debs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: main
            url: https://packages-cf.termux.dev/apt/termux-main/pool/main/
            release_prefix: XoDos-main
          - name: x11
            url: https://packages-cf.termux.dev/apt/termux-x11/pool/main/
            release_prefix: XoDos-x11
          - name: root
            url: https://packages-cf.termux.dev/apt/termux-root/pool/stable/
            release_prefix: XoDos-root
          - name: glibc
            url: https://packages-cf.termux.dev/apt/termux-glibc/pool/stable/
            release_prefix: XoDos-glibc

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SRC_URL: ${{ matrix.url }}
      REL_PREFIX: ${{ matrix.release_prefix }}
      REPO_NAME: ${{ matrix.name }}
      TAG_PREFIX: ${{ inputs.tag_prefix }}
      MAX_DEBS: ${{ inputs.max_debs }}
      SKIP_LIST: ${{ inputs.skip }}

    steps:
      - name: Skip check
        id: skipcheck
        run: |
          set -euo pipefail
          for s in $SKIP_LIST; do
            if [ "$s" = "$REPO_NAME" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo ">>> Skipping $REPO_NAME (per input)"
              exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.skipcheck.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Install tools
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils xz-utils zstd dpkg-dev perl wget ca-certificates

      # -----------------------------------------------------------------
      # Recursive crawl + download.  wget walks:
      #   pool/main/           (lvl 0)
      #     a/                 (lvl 1)   ← single-char & lib* subdirs
      #       alsa-lib/        (lvl 2)   ← package dirs
      #         *.deb          (lvl 3)
      #
      #   -A '*.deb'    only fetch debs
      #   -nH --cut-dirs=100   strip every server-side dir → flat into work/orig/
      # -----------------------------------------------------------------
      - name: Download all debs (recursive)
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p work/orig

          echo ">>> Crawling $SRC_URL"
          wget \
            --recursive \
            --level=6 \
            --no-parent \
            --no-host-directories \
            --cut-dirs=100 \
            --accept='*.deb' \
            --directory-prefix=work/orig \
            --tries=5 --waitretry=3 --timeout=30 \
            --no-verbose \
            "$SRC_URL" 2>&1 | tail -40 || true

          # Some wget versions create work/orig/<host>/... even with -nH
          # depending on redirects. Flatten just in case.
          if [ -d "work/orig" ]; then
            find work/orig -mindepth 2 -type f -name '*.deb' \
              -exec mv -f {} work/orig/ \; 2>/dev/null || true
          fi

          got=$(find work/orig -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          echo ">>> Downloaded: $got .deb files"
          if [ "$got" -eq 0 ]; then
            echo "::error::wget returned no .deb files for $REPO_NAME"
            exit 1
          fi

          if [ "$MAX_DEBS" != "0" ] && [ -n "$MAX_DEBS" ]; then
            echo ">>> Limiting to first $MAX_DEBS"
            # keep only first N, delete rest
            find work/orig -maxdepth 1 -name '*.deb' -printf '%f\n' \
              | sort | tail -n +$((MAX_DEBS + 1)) \
              | while read -r f; do rm -f "work/orig/$f"; done
            echo ">>> After limit: $(find work/orig -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')"
          fi

          du -sh work/orig

      # -----------------------------------------------------------------
      # Patch each deb:
      #   dpkg-deb -R   → temp dir with DEBIAN/ + data/data/com.termux/...
      #   rename prefix → data/data/app.xodos2
      #   perl -0777    → replace com.termux → app.xodos2 in every file
      #                   (SAME LENGTH → safe on ELF binaries)
      #   fix abs symlinks
      #   dpkg-deb -b --root-owner-group → repack as root:root
      # -----------------------------------------------------------------
      - name: Patch every deb
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail

          cat > /tmp/patch_one.sh <<'EOS'
          #!/bin/bash
          set -euo pipefail
          src="$1"
          dst="$2"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          if ! dpkg-deb -R "$src" "$tmp" 2>/dev/null; then
            echo "SKIP (cannot -R): $(basename "$src")" >&2
            exit 1
          fi

          # 1) Rename on-disk prefix tree
          if [ -d "$tmp/data/data/com.termux" ]; then
            mv "$tmp/data/data/com.termux" "$tmp/data/data/app.xodos2"
          fi

          # 2) Fix absolute symlinks pointing into the old prefix
          find "$tmp" -type l -print0 2>/dev/null \
            | while IFS= read -r -d '' link; do
                target="$(readlink "$link" || true)"
                case "$target" in
                  *com.termux*)
                    new="${target//com.termux/app.xodos2}"
                    ln -sfn "$new" "$link"
                    ;;
                esac
              done

          # 3) Binary-safe content patch.  -0777 slurps whole file so
          #    embedded NULs / CRLFs don't matter.  Length is preserved
          #    (com.termux == app.xodos2 == 10 chars) so ELF offsets,
          #    section sizes and relocations stay valid.
          #    Batch many files per perl invocation for speed.
          find "$tmp" -type f -exec \
            perl -0777 -i -pe 's{com\.termux}{app.xodos2}g' {} + 2>/dev/null || true

          # 4) Repack as root:root without running as root
          if ! dpkg-deb --root-owner-group -b "$tmp" "$dst" >/dev/null 2>&1; then
            echo "SKIP (cannot -b): $(basename "$src")" >&2
            exit 1
          fi
          exit 0
          EOS
          chmod +x /tmp/patch_one.sh

          mkdir -p work/patched
          cd work

          echo ">>> Patching debs (parallel 4)…"
          # Export so subshells see them
          declare -a files
          mapfile -t files < <(find orig -maxdepth 1 -name '*.deb' -printf '%f\n' | sort)

          total="${#files[@]}"
          echo ">>> Total to patch: $total"

          # Run in parallel; each worker patches and removes its source
          patched_count_file=/tmp/patched.count
          echo 0 > "$patched_count_file"

          patch_and_count() {
            base="$1"
            if /tmp/patch_one.sh "orig/$base" "patched/$base"; then
              rm -f "orig/$base"
              # atomic-ish increment
              {
                flock 9
                n=$(cat /tmp/patched.count)
                n=$((n + 1))
                echo "$n" > /tmp/patched.count
                if [ $((n % 100)) -eq 0 ]; then
                  echo ">>> patched $n/$total" >&2
                fi
              } 9>/tmp/patched.lock
            fi
          }
          export -f patch_and_count
          export total

          printf '%s\n' "${files[@]}" \
            | xargs -P 4 -I{} bash -c 'patch_and_count "$@"' _ {}

          ok=$(cat "$patched_count_file")
          echo ">>> DONE: patched=$ok / total=$total"
          echo ">>> Patched dir size:"
          du -sh patched
          find patched -maxdepth 1 -name '*.deb' -printf '%f\n' | head -5

      # -----------------------------------------------------------------
      # Split into chunks of <= 1000 (GitHub hard limit per release).
      # -----------------------------------------------------------------
      - name: Split into chunks
        if: steps.skipcheck.outputs.skip == 'false'
        id: chunks
        run: |
          set -euo pipefail
          cd work
          rm -rf chunks && mkdir -p chunks

          mapfile -t files < <(find patched -maxdepth 1 -name '*.deb' -printf '%f\n' | sort)
          total="${#files[@]}"
          echo ">>> Patched debs: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::Nothing patched"; exit 1
          fi

          chunk_idx=0
          i=0
          for f in "${files[@]}"; do
            if [ $((i % 1000)) -eq 0 ]; then
              chunk_idx=$((chunk_idx + 1))
              mkdir -p "chunks/part${chunk_idx}"
            fi
            cp -a "patched/$f" "chunks/part${chunk_idx}/"
            i=$((i + 1))
          done

          nchunks=$(find chunks -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "chunks=$nchunks" >> "$GITHUB_OUTPUT"
          echo "total=$total"     >> "$GITHUB_OUTPUT"
          for d in chunks/part*; do
            echo "  $d: $(find "$d" -name '*.deb' | wc -l) files, $(du -sh "$d" | cut -f1)"
          done

      # -----------------------------------------------------------------
      # Create one release per chunk and upload.
      # -----------------------------------------------------------------
      - name: Create releases + upload
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd work

          TS=$(date -u +'%Y.%m.%d-%H%M%S')
          PFX="${TAG_PREFIX:-xodos}"
          nchunks=${{ steps.chunks.outputs.chunks }}
          total=${{ steps.chunks.outputs.total }}

          for d in chunks/part*; do
            part="${d##*part}"
            tag="${PFX}-${REL_PREFIX}-p${part}-${TS}"
            title="XoDos ${REPO_NAME} (part ${part}/${nchunks}) — ${TS}"

            cat > /tmp/notes.md <<EOF
          Patched Termux \`.deb\` packages for **${REPO_NAME}**.

          - Source pool: \`${SRC_URL}\`
          - Prefix patch: \`/data/data/com.termux\` → \`/data/data/app.xodos2\`
          - Applied inside files (binary-safe) and to the on-disk tree, then repacked with \`dpkg-deb --root-owner-group -b\`
          - Part **${part}/${nchunks}** — total patched this run: **${total}**
          - Built by GitHub Actions run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

            echo ">>> Creating release: $tag"
            gh release create "$tag" \
              --repo "$REPO" \
              --title "$title" \
              --notes-file /tmp/notes.md \
              --target "${{ github.sha }}"

            mapfile -t files < <(find "$d" -maxdepth 1 -name '*.deb' -printf '%p\n' | sort)
            n="${#files[@]}"
            echo ">>> Uploading $n files to $tag"
            i=0; failed=0

            for f in "${files[@]}"; do
              i=$((i + 1))
              ok=0
              for attempt in 1 2 3 4 5; do
                if gh release upload "$tag" "$f" --repo "$REPO" --clobber 2>/tmp/gh_err.log; then
                  ok=1; break
                fi
                if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
                  backoff=$((attempt * 15))
                else
                  backoff=$((attempt * 3))
                fi
                sleep "$backoff"
              done

              if [ "$ok" -eq 1 ]; then
                if [ $((i % 50)) -eq 0 ] || [ "$i" -eq "$n" ]; then
                  echo "  [$i/$n] uploaded"
                fi
              else
                echo "  FAILED: $(basename "$f")"
                sed -n '1,3p' /tmp/gh_err.log || true
                failed=$((failed + 1))
              fi
              sleep 0.15
            done

            echo ">>> $tag done: $((n - failed))/${n} uploaded, failed=$failed"
            if [ "$failed" -gt 0 ]; then
              echo "::warning::$failed upload(s) failed for $tag"
            fi
          done

      - name: Summary
        if: steps.skipcheck.outputs.skip == 'false'
        run: |
          {
            echo "### $REPO_NAME"
            echo ""
            echo "- Source: \`$SRC_URL\`"
            echo "- Patched debs: **${{ steps.chunks.outputs.total }}**"
            echo "- Releases created: **${{ steps.chunks.outputs.chunks }}**"
          } >> "$GITHUB_STEP_SUMMARY"
