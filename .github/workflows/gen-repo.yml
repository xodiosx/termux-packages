name: Build APT Repository on Hugging Face

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repo that hosts release tags (owner/name)"
        required: true
        default: "xodiosx/termux-packages"
      hf_repo_id:
        description: "Hugging Face dataset repo (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      tags:
        description: "Space/comma tags. Empty = auto-discover xodos-XoDos-* tags."
        required: false
        default: ""
      repos:
        description: "Sub-repos to include (comma-separated)"
        required: false
        default: "main,x11,root,glibc"
      clean_hf:
        description: "DELETE the entire HF repo and recreate it before uploading"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    env:
      HF_REPO: ${{ inputs.hf_repo_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SRC: ${{ inputs.source_repo }}
      CLEAN_HF: ${{ inputs.clean_hf }}
    steps:

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dpkg-dev apt-utils gzip zstd jq curl
        pip install -q --upgrade "huggingface_hub<1.0"
        python3 -c 'import huggingface_hub; print("huggingface_hub", huggingface_hub.__version__)'

    # ==================================================================
    # 1. Resolve tags
    # ==================================================================
    - name: Resolve tags
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_REPOS: ${{ inputs.repos }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/plan
        : > /tmp/plan/groups.txt

        if [ -n "$INPUT_TAGS" ]; then
          read -a TAGS <<< "${INPUT_TAGS//,/ }"
        else
          REPOS_ALT=$(echo "$INPUT_REPOS" | tr ',' '|')
          mapfile -t TAGS < <(
            gh release list --repo "$SRC" --limit 1000 \
              --json tagName,createdAt \
              --jq "sort_by(.createdAt) | .[].tagName | select(test(\"^xodos-XoDos-(${REPOS_ALT})-p[0-9]+-\"))"
          )
        fi

        if [ "${#TAGS[@]}" -eq 0 ]; then
          echo "::error::No tags found"; exit 1
        fi

        for tag in "${TAGS[@]}"; do
          case "$tag" in
            xodos-XoDos-main-p*)  printf 'main\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-x11-p*)   printf 'x11\t%s\n'   "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-root-p*)  printf 'root\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-glibc-p*) printf 'glibc\t%s\n' "$tag" >> /tmp/plan/groups.txt ;;
          esac
        done

        cut -f1 /tmp/plan/groups.txt | sort -u > /tmp/plan/repos.txt
        echo ">>> Groups:"
        sort /tmp/plan/groups.txt | sed 's/^/    /'

    # ==================================================================
    # 2. Clean Hugging Face (delete + recreate, reliably)
    # ==================================================================
    - name: Clean Hugging Face repo
      if: ${{ inputs.clean_hf }}
      run: |
        set -euo pipefail
        python3 -c "
        import os
        from huggingface_hub import HfApi
        from huggingface_hub.utils import RepositoryNotFoundError
        api = HfApi()
        repo = os.environ['HF_REPO']
        token = os.environ['HF_TOKEN']
        try:
            api.delete_repo(repo_id=repo, repo_type='dataset', token=token)
            print('>>> deleted:', repo)
        except RepositoryNotFoundError:
            print('>>> repo did not exist')
        except Exception as e:
            print('>>> WARN: delete failed:', type(e).__name__, e)
        api.create_repo(repo_id=repo, repo_type='dataset', exist_ok=True, token=token)
        print('>>> recreated empty:', repo)
        files = list(api.list_repo_files(repo_id=repo, repo_type='dataset', token=token))
        print('>>> files after recreate:', len(files))
        "

    # ==================================================================
    # 3. Download .deb files from GitHub Releases
    # ==================================================================
    - name: Download .deb from GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        rm -rf /tmp/raw-debs
        mkdir -p /tmp/raw-debs

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          echo ">>> repo: $repo"
          mkdir -p "/tmp/raw-debs/$repo"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "    downloading: $tag"
            tmpdir=$(mktemp -d)
            if gh release download "$tag" --repo "$SRC" \
                 --pattern "*.deb" --dir "$tmpdir" 2>/tmp/dl_err.log
            then
              n=$(find "$tmpdir" -maxdepth 1 -type f -name '*.deb' | wc -l)
              echo "    got $n .deb"
              find "$tmpdir" -maxdepth 1 -type f -name '*.deb' -print0 \
                | xargs -0r mv -t "/tmp/raw-debs/$repo/"
            else
              echo "    WARN: failed to download $tag"
              head -3 /tmp/dl_err.log | sed 's/^/        /' || true
            fi
            rm -rf "$tmpdir"
          done < <(grep -P "^${repo}\t" /tmp/plan/groups.txt | cut -f2)
          total=$(find "/tmp/raw-debs/$repo" -maxdepth 1 -type f -name '*.deb' | wc -l)
          echo "    repo $repo total: $total"
        done < /tmp/plan/repos.txt

    # ==================================================================
    # 4. Build full APT tree (dists + pool) locally
    # ==================================================================
    - name: Build APT repository tree
      run: |
        set -euo pipefail
        BUILD=/tmp/aptrepo
        rm -rf "$BUILD"
        mkdir -p "$BUILD"
        : > /tmp/override.empty

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          case "$repo" in
            main)  dist=stable; comp=main ;;
            x11)   dist=x11;    comp=main ;;
            root)  dist=root;   comp=stable ;;
            glibc) dist=glibc;  comp=main ;;
            *)     continue ;;
          esac

          echo "=================================================="
          echo ">>> building: xodos-${repo}  (dist=$dist comp=$comp)"
          echo "=================================================="

          outdir="$BUILD/xodos-${repo}"
          pooldir="$outdir/pool/${comp}"
          mkdir -p "$pooldir"

          tsv="/tmp/all-${repo}.tsv"
          : > "$tsv"
          shopt -s nullglob
          for deb in /tmp/raw-debs/"$repo"/*.deb; do
            dpkg-deb -I "$deb" >/dev/null 2>&1 || continue
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            printf '%s\t%s\t%s\n' "$pkg" "$ver" "$deb" >> "$tsv"
          done
          shopt -u nullglob

          winners="/tmp/winners-${repo}.tsv"
          sort -t$'\t' -k1,1 -k2,2rV "$tsv" | awk -F'\t' '!seen[$1]++' > "$winners"

          placed=0
          while IFS=$'\t' read -r pkg ver path; do
            [ -z "$pkg" ] && continue
            first_letter=$(printf '%s' "$pkg" | cut -c1 | tr 'A-Z' 'a-z')
            dest_dir="${pooldir}/${first_letter}/${pkg}"
            mkdir -p "$dest_dir"
            cp -a "$path" "$dest_dir/"
            placed=$((placed + 1))
          done < "$winners"
          echo ">>> placed ${placed} unique packages in pool"
          echo ">>> pool size: $(find "$pooldir" -type f -name '*.deb' | wc -l) .deb"

          dists="$outdir/dists/${dist}/${comp}"
          mkdir -p "$dists/binary-aarch64" "$dists/binary-all"

          cd "$outdir"
          dpkg-scanpackages --multiversion "pool/${comp}" /tmp/override.empty \
            > "dists/${dist}/${comp}/binary-aarch64/Packages"
          dpkg-scanpackages --multiversion --arch all "pool/${comp}" /tmp/override.empty \
            > "dists/${dist}/${comp}/binary-all/Packages"
          cd - >/dev/null

          gzip -kf -9 "$dists/binary-aarch64/Packages"
          gzip -kf -9 "$dists/binary-all/Packages"
          rm -f "$dists/binary-aarch64/Packages.xz" "$dists/binary-all/Packages.xz"

          echo "    binary-aarch64: $(grep -c '^Package:' "$dists/binary-aarch64/Packages" || true)"
          echo "    binary-all:     $(grep -c '^Package:' "$dists/binary-all/Packages" || true)"

          conf="/tmp/release-${repo}.conf"
          {
            echo 'APT::FTPArchive::Release::Origin "xodos";'
            echo "APT::FTPArchive::Release::Label \"xodos Termux ${repo}\";"
            echo "APT::FTPArchive::Release::Suite \"${dist}\";"
            echo "APT::FTPArchive::Release::Codename \"${dist}\";"
            echo 'APT::FTPArchive::Release::Architectures "aarch64 all";'
            echo "APT::FTPArchive::Release::Components \"${comp}\";"
            echo "APT::FTPArchive::Release::Description \"xodos Termux ${repo} packages\";"
          } > "$conf"

          cd "$outdir"
          apt-ftparchive -c "$conf" release "dists/${dist}" > "dists/${dist}/Release"
          cp "dists/${dist}/Release" "dists/${dist}/InRelease"
          cd - >/dev/null
        done < /tmp/plan/repos.txt

        cat > "$BUILD/README.md" <<'READMEEOF'
        # xodos-packages

        APT repository for xodos Termux packages (aarch64).

        ## sources.list

        ```
        deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-main stable main
        deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-x11 x11 main
        deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-root root stable
        deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-glibc glibc main
        ```
        READMEEOF

        echo ""
        echo ">>> final tree:"
        find "$BUILD" -maxdepth 3 -type d | sort | sed 's/^/    /'
        echo ""
        echo ">>> size: $(du -sh "$BUILD" | awk '{print $1}')"
        echo ">>> total .deb files: $(find "$BUILD" -type f -name '*.deb' | wc -l)"

    # ==================================================================
    # 5. Ensure HF repo exists
    # ==================================================================
    - name: Ensure HF repo exists
      run: |
        set -euo pipefail
        python3 -c "
        import os
        from huggingface_hub import HfApi
        api = HfApi()
        api.create_repo(
            repo_id=os.environ['HF_REPO'],
            repo_type='dataset',
            exist_ok=True,
            token=os.environ['HF_TOKEN'],
        )
        print('>>> repo ready:', os.environ['HF_REPO'])
        "

    # ==================================================================
    # 6. Upload the WHOLE tree with upload_large_folder
    #
    # This is the critical fix. upload_folder makes one commit and
    # silently fails on multi-GB uploads. upload_large_folder splits
    # into multiple commits, is resumable, and handles retries.
    # ==================================================================
    - name: Upload to Hugging Face (upload_large_folder)
      run: |
        set -euo pipefail
        python3 -c "
        import os, sys
        from huggingface_hub import HfApi
        api = HfApi()
        print('>>> starting upload_large_folder...')
        api.upload_large_folder(
            folder_path='/tmp/aptrepo',
            repo_id=os.environ['HF_REPO'],
            repo_type='dataset',
            token=os.environ['HF_TOKEN'],
            num_workers=4,
        )
        print('>>> upload complete')
        "

    # ==================================================================
    # 7. Verify
    # ==================================================================
    - name: Verify
      run: |
        set -euo pipefail
        base="https://huggingface.co/datasets/${HF_REPO}/resolve/main"
        ok=0; bad=0
        for f in \
          "xodos-main/dists/stable/Release" \
          "xodos-main/dists/stable/main/binary-aarch64/Packages.gz" \
          "xodos-x11/dists/x11/Release" \
          "xodos-x11/dists/x11/main/binary-aarch64/Packages.gz" \
          "xodos-root/dists/root/Release" \
          "xodos-glibc/dists/glibc/Release"; do
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/$f")
          if [ "$code" = "200" ]; then
            echo "  OK   $f"; ok=$((ok+1))
          else
            echo "  $code  $f"; bad=$((bad+1))
          fi
        done
        echo ">>> ok=$ok bad=$bad"
        echo ""
        echo ">>> total files on HF:"
        python3 -c "
        import os
        from huggingface_hub import HfApi
        api = HfApi()
        files = list(api.list_repo_files(repo_id=os.environ['HF_REPO'], repo_type='dataset', token=os.environ['HF_TOKEN']))
        print('    ', len(files), 'files')
        deb = [f for f in files if f.endswith('.deb')]
        print('    ', len(deb), '.deb files')
        for f in deb[:5]:
            print('      ', f)
        "

    - name: Summary
      run: |
        {
          echo "## APT Repository on Hugging Face"
          echo ""
          echo "- HF repo: https://huggingface.co/datasets/${{ inputs.hf_repo_id }}"
          echo "- clean_hf: \`${{ inputs.clean_hf }}\`"
          echo ""
          echo "### sources.list"
          echo '```'
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-main stable main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-x11 x11 main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-root root stable"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-glibc glibc main"
          echo '```'
        } >> $GITHUB_STEP_SUMMARY
