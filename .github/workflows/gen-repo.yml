name: Regenerate APT Repository on Hugging Face

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        type: choice
        default: metadata-only
        options:
          - metadata-only
          - full
          - pool-only
      hf_repo_id:
        description: "Hugging Face dataset repo (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      repos:
        description: "Repos to process (comma-separated)"
        required: true
        default: "main,x11,root,glibc,tur,tur-on-device,tur-continuous"
      source_repo:
        description: "GitHub repo with releases (used in full / pool-only)"
        required: false
        default: "xodiosx/termux-packages"
      patch_prefix:
        description: "Patch com.termux → app.xodos2 (ASCII + UTF-16) in .deb files"
        type: boolean
        default: true
      force_push:
        description: "Force push: for each SELECTED repo, delete its subtree on HF and re-upload."
        type: boolean
        default: false
      clean_hf:
        description: "Wipe the ENTIRE HF repo before upload (full mode only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: regenerate-repo
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    env:
      HF_REPO: ${{ inputs.hf_repo_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
      SRC_REPO: ${{ inputs.source_repo }}
      MODE: ${{ inputs.mode }}
      REPOS_IN: ${{ inputs.repos }}
      PATCH_PREFIX: ${{ inputs.patch_prefix }}
      FORCE_PUSH: ${{ inputs.force_push }}
      CLEAN_HF: ${{ inputs.clean_hf }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      WORK_DIR: ${{ github.workspace }}/work

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils gzip jq xz-utils zstd
          pip install -q --upgrade "huggingface_hub>=1.29.0"

      - name: Compute targets
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR"
          : > "$WORK_DIR/targets.txt"
          : > "$WORK_DIR/dist-comp.txt"
          for r in $(echo "$REPOS_IN" | tr ',' ' '); do
            r=$(echo "$r" | tr -d ' ')
            [ -z "$r" ] && continue
            case "$r" in
              main)           echo "xodos-main"  >> "$WORK_DIR/targets.txt"; echo "xodos-main stable main"          >> "$WORK_DIR/dist-comp.txt" ;;
              x11)            echo "xodos-x11"   >> "$WORK_DIR/targets.txt"; echo "xodos-x11 x11 main"                >> "$WORK_DIR/dist-comp.txt" ;;
              root)           echo "xodos-root"  >> "$WORK_DIR/targets.txt"; echo "xodos-root root stable"            >> "$WORK_DIR/dist-comp.txt" ;;
              glibc)          echo "xodos-glibc" >> "$WORK_DIR/targets.txt"; echo "xodos-glibc glibc main"            >> "$WORK_DIR/dist-comp.txt" ;;
              tur)            echo "xodos-tur"   >> "$WORK_DIR/targets.txt"; echo "xodos-tur tur-packages tur"        >> "$WORK_DIR/dist-comp.txt" ;;
              tur-on-device)  echo "xodos-tur"   >> "$WORK_DIR/targets.txt"; echo "xodos-tur tur-packages tur-on-device" >> "$WORK_DIR/dist-comp.txt" ;;
              tur-continuous) echo "xodos-tur"   >> "$WORK_DIR/targets.txt"; echo "xodos-tur tur-packages tur-continuous" >> "$WORK_DIR/dist-comp.txt" ;;
              *) echo "::error::Unknown repo: $r"; exit 1 ;;
            esac
          done
          sort -u "$WORK_DIR/targets.txt" -o "$WORK_DIR/targets.txt"
          sort -u "$WORK_DIR/dist-comp.txt" -o "$WORK_DIR/dist-comp.txt"
          echo ">>> Mode:         $MODE"
          echo ">>> Patch prefix: $PATCH_PREFIX"
          echo ">>> Force push:   $FORCE_PUSH"
          echo ">>> Clean HF:     $CLEAN_HF"
          echo ">>> Targets:"
          sed 's/^/    /' "$WORK_DIR/targets.txt"

      - name: Wipe Hugging Face repo (full wipe)
        if: ${{ inputs.mode == 'full' && inputs.clean_hf }}
        run: |
          set -euo pipefail
          echo "::warning::clean_hf=true — DELETING entire HF repo"
          cat > /tmp/wipe.py << 'PYEOF'
          import os
          from huggingface_hub import HfApi
          from huggingface_hub.utils import RepositoryNotFoundError
          api = HfApi()
          repo = os.environ["HF_REPO"]
          token = os.environ["HF_TOKEN"]
          try:
              api.delete_repo(repo_id=repo, repo_type="dataset", token=token)
              print(">>> deleted:", repo)
          except RepositoryNotFoundError:
              print(">>> repo did not exist")
          api.create_repo(repo_id=repo, repo_type="dataset", exist_ok=True, token=token)
          print(">>> recreated empty")
          PYEOF
          python3 /tmp/wipe.py

      - name: Download .deb from Hugging Face (validated)
        if: ${{ inputs.mode == 'metadata-only' }}
        run: |
          set -euo pipefail
          cat > /tmp/dl_hf.py << 'PYEOF'
          import os, sys, time, urllib.request, urllib.parse, concurrent.futures
          import pathlib
          from huggingface_hub import HfApi

          repo = os.environ["HF_REPO"]
          token = os.environ.get("HF_TOKEN")
          work = os.environ["WORK_DIR"]
          targets = [l.strip() for l in open(work + "/targets.txt") if l.strip()]
          api = HfApi()
          all_files = list(api.list_repo_files(repo_id=repo, repo_type="dataset", token=token))
          prefixes = tuple(f"{t}/pool/" for t in targets)
          selected = [f for f in all_files if f.endswith(".deb") and any(f.startswith(p) for p in prefixes)]
          print(f">>> matching .deb: {len(selected)}")
          if not selected:
              raise SystemExit("::error::no matching .deb on HF")
          BASE = f"https://huggingface.co/datasets/{repo}/resolve/main/"
          DEST = pathlib.Path("/tmp/hf-debs")
          headers = {"User-Agent": "xodos-pkg-sync/1.0"}
          if token: headers["Authorization"] = f"Bearer {token}"

          def valid(b): return b.startswith(b"!<arch>")
          def html(b):
              h = b[:512].lower()
              return b"<!doctype" in h or b"<html" in h

          def fetch(rel):
              url = BASE + urllib.parse.quote(rel, safe="/")
              out = DEST / rel
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists() and out.stat().st_size > 0:
                  with open(out, "rb") as f:
                      if valid(f.read(8)): return ("cached", rel)
                  out.unlink()
              last = ""
              for attempt in range(1, 9):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=180) as r:
                          ct = r.headers.get("Content-Type", "").lower()
                          if "html" in ct or "text/" in ct:
                              raise ValueError(f"HTML ct: {ct}")
                          data = r.read()
                          if not valid(data[:8]):
                              if html(data): raise ValueError("HTML body")
                              raise ValueError(f"not .deb {data[:8]!r}")
                          with open(out, "wb") as f: f.write(data)
                          return ("ok", rel)
                  except urllib.error.HTTPError as e:
                      last = f"HTTP {e.code}"
                      time.sleep(min(60, attempt * 8) if e.code == 429 else min(30, attempt * 3))
                  except Exception as e:
                      last = f"{type(e).__name__}: {str(e)[:80]}"
                      time.sleep(min(30, attempt * 3))
              if out.exists(): out.unlink()
              return ("fail", rel, last)

          ok = cached = fail = 0; failed = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              for kind, rel, *rest in ex.map(fetch, selected):
                  if kind == "ok": ok += 1
                  elif kind == "cached": cached += 1
                  else:
                      fail += 1; failed.append((rel, rest[0] if rest else "?"))
                  if (ok + cached + fail) % 200 == 0:
                      print(f">>> {ok+cached+fail}/{len(selected)} ok={ok} cached={cached} fail={fail}")
          print(f">>> ok={ok} cached={cached} fail={fail}")
          for rel, err in failed[:30]: print(f"    FAIL {rel} — {err}")
          if ok + cached == 0: sys.exit("::error::nothing downloaded")
          PYEOF
          python3 /tmp/dl_hf.py
          n=$(find /tmp/hf-debs -type f -name '*.deb' | wc -l)
          echo ">>> valid .deb on disk: $n"

      - name: Download .deb from GitHub Releases
        if: ${{ inputs.mode != 'metadata-only' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gh-debs
          mkdir -p /tmp/gh-debs
          : > "$WORK_DIR/tags-for-run.txt"

          mapfile -t TAGS < <(
            gh release list --repo "$SRC_REPO" --limit 1000 \
              --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | .[].tagName | select(startswith("xodos-XoDos-"))'
          )
          echo ">>> total releases: ${#TAGS[@]}"

          for tag in "${TAGS[@]}"; do
            for target in $(cat "$WORK_DIR/targets.txt"); do
              short="${target#xodos-}"
              case "$short" in
                main)  pattern='^xodos-XoDos-main-p[0-9]+-' ;;
                x11)   pattern='^xodos-XoDos-x11-p[0-9]+-' ;;
                root)  pattern='^xodos-XoDos-root-p[0-9]+-' ;;
                glibc) pattern='^xodos-XoDos-glibc-p[0-9]+-' ;;
                tur)   pattern='^xodos-XoDos-tur-(continuous|on-device)-p[0-9]+-|^xodos-XoDos-tur-p[0-9]+-' ;;
              esac
              if echo "$tag" | grep -qE "$pattern"; then
                echo "$target|$tag" >> "$WORK_DIR/tags-for-run.txt"
                break
              fi
            done
          done
          if [ ! -s "$WORK_DIR/tags-for-run.txt" ]; then
            echo "::error::No matching tags"; exit 1
          fi

          download_tag() {
            local tag="$1" target="$2"
            local dest="/tmp/gh-debs/$target"
            mkdir -p "$dest"
            local assets_file="/tmp/assets-${tag}.txt"
            if ! gh release view "$tag" --repo "$SRC_REPO" \
                 --json assets --jq '.assets[].name' > "$assets_file" 2>/dev/null; then
              echo "        FAIL list: $tag"; return 1
            fi
            local total; total=$(wc -l < "$assets_file")
            echo "        $total assets"
            local ok=0 fail=0 count=0
            while IFS= read -r fname; do
              [ -z "$fname" ] && continue
              case "$fname" in *.deb) ;; *) continue ;; esac
              count=$((count + 1))
              local url="https://github.com/${SRC_REPO}/releases/download/${tag}/${fname}"
              local out="$dest/$fname"
              [ -s "$out" ] && { ok=$((ok + 1)); continue; }
              local attempt=1 cok=0
              while [ "$attempt" -le 5 ]; do
                if curl -fsSL --retry 0 --connect-timeout 30 --max-time 600 \
                     -o "$out" "$url" 2>/dev/null; then
                  cok=1; break
                fi
                rm -f "$out"; sleep $((attempt * 3)); attempt=$((attempt + 1))
              done
              if [ "$cok" = "1" ]; then ok=$((ok + 1)); else fail=$((fail + 1)); fi
              if [ $((count % 200)) -eq 0 ]; then
                echo "        [$count/$total] ok=$ok fail=$fail"
              fi
            done < "$assets_file"
            echo "        done: ok=$ok fail=$fail"
            return 0
          }

          failed=""
          tag_num=0
          total_tags=$(wc -l < "$WORK_DIR/tags-for-run.txt")
          while IFS='|' read -r target tag; do
            [ -z "$tag" ] && continue
            tag_num=$((tag_num + 1))
            echo ">>> [$tag_num/$total_tags] $target / $tag"
            if ! download_tag "$tag" "$target"; then failed="$failed $tag"; fi
          done < "$WORK_DIR/tags-for-run.txt"

          if [ -n "$failed" ]; then echo "::error::Failed:$failed"; exit 1; fi
          echo ">>> total .deb: $(find /tmp/gh-debs -type f -name '*.deb' | wc -l)"
          du -sh /tmp/gh-debs

      # ==================================================================
      # PATCH STEP: Optional prefix patch.
      # Uses a single, highly optimized Python script per .deb.
      # Handles ASCII, UTF-16 LE, UTF-16 BE, and nested directories.
      # ==================================================================
      - name: Patch com.termux → app.xodos2 in downloaded .deb
        if: ${{ inputs.patch_prefix }}
        run: |
          set -euo pipefail

          if [ "$MODE" = "metadata-only" ]; then
            SRC_ROOT=/tmp/hf-debs
          else
            SRC_ROOT=/tmp/gh-debs
          fi
          echo ">>> SRC_ROOT=$SRC_ROOT"

          # Create the Python script that handles both folder renames and file patching
          cat > /tmp/patch_dir.py <<'PYEOF'
          import os, sys

          root = sys.argv[1]
          
          # 1. Rename all nested directories containing com.termux (bottom-up)
          for dirpath, dirnames, filenames in os.walk(root, topdown=False):
              for d in dirnames:
                  if 'com.termux' in d:
                      old_path = os.path.join(dirpath, d)
                      new_path = os.path.join(dirpath, d.replace('com.termux', 'app.xodos2'))
                      try:
                          os.rename(old_path, new_path)
                      except Exception:
                          pass

          # 2. Patch binary and text files
          old_ascii = b"com.termux"
          new_ascii = b"app.xodos2"
          old_le = "com.termux".encode("utf-16-le")
          new_le = "app.xodos2".encode("utf-16-le")
          old_be = "com.termux".encode("utf-16-be")
          new_be = "app.xodos2".encode("utf-16-be")

          for dirpath, _, filenames in os.walk(root):
              for filename in filenames:
                  # Skip compressed archives to avoid corruption
                  if filename.endswith(('.gz', '.xz', '.zst', '.bz2', '.lz4', '.lzma', '.zip', '.jar', '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico')):
                      continue
                  filepath = os.path.join(dirpath, filename)
                  try:
                      with open(filepath, 'rb') as f:
                          data = f.read()
                  except Exception:
                      continue

                  changed = False
                  if old_ascii in data:
                      data = data.replace(old_ascii, new_ascii)
                      changed = True
                  if old_le in data:
                      data = data.replace(old_le, new_le)
                      changed = True
                  if old_be in data:
                      data = data.replace(old_be, new_be)
                      changed = True

                  if changed:
                      try:
                          with open(filepath, 'wb') as f:
                              f.write(data)
                      except Exception:
                          pass
          PYEOF

          cat > /tmp/patch_one.sh <<'EOS'
          #!/usr/bin/env bash
          set -uo pipefail

          src="$1"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Refuse non-.deb
          magic="$(head -c 8 "$src")"
          if [ "$magic" != "!<arch>" ]; then
            echo "NOT-A-DEB: $src" >&2
            exit 0
          fi

          # Extract
          if ! dpkg-deb -R "$src" "$tmp" 2>/tmp/dpkg.err; then
            echo "EXTRACT-FAIL: $(basename "$src"): $(head -1 /tmp/dpkg.err)" >&2
            exit 0
          fi

          # Run the python patcher on the extracted directory
          python3 /tmp/patch_dir.py "$tmp"

          # DEBIAN permissions + conffiles cleanup
          if [ -d "$tmp/DEBIAN" ]; then
            for s in preinst postinst prerm postrm config; do
              [ -f "$tmp/DEBIAN/$s" ] && chmod 0755 "$tmp/DEBIAN/$s" || true
            done
            for s in control conffiles md5sums shlibs symbols templates triggers; do
              [ -f "$tmp/DEBIAN/$s" ] && chmod 0644 "$tmp/DEBIAN/$s" || true
            done
            if [ -f "$tmp/DEBIAN/conffiles" ]; then
              : > "$tmp/DEBIAN/conffiles.new"
              while IFS= read -r line || [ -n "$line" ]; do
                line="${line%$'\r'}"
                case "$line" in ""|\#*) printf '%s\n' "$line" >> "$tmp/DEBIAN/conffiles.new"; continue ;; esac
                rel="${line#/}"
                if [ -e "$tmp/$rel" ] || [ -L "$tmp/$rel" ]; then
                  printf '%s\n' "$line" >> "$tmp/DEBIAN/conffiles.new"
                fi
              done < "$tmp/DEBIAN/conffiles"
              mv "$tmp/DEBIAN/conffiles.new" "$tmp/DEBIAN/conffiles"
            fi
          fi

          # Ensure data dirs are readable (only if data/ exists)
          if [ -d "$tmp/data" ]; then
            find "$tmp/data" -type d -print0 2>/dev/null | while IFS= read -r -d '' d; do
              cur="$(stat -c '%a' "$d" 2>/dev/null || echo 755)"
              if [ $((0$cur & 0700)) -ne 0700 ]; then chmod u+rwx "$d" 2>/dev/null || true; fi
            done || true
          fi

          # Repack with fallbacks
          if dpkg-deb --root-owner-group -b "$tmp" "$src" >/dev/null 2>&1; then
            echo "OK"
          elif dpkg-deb --root-owner-group -Zgzip -b "$tmp" "$src" >/dev/null 2>&1; then
            echo "OK-GZIP"
          else
            echo "PACK-FAIL: $src" >&2
          fi
          exit 0
          EOS
          chmod +x /tmp/patch_one.sh

          : > /tmp/patch-outcomes.txt
          : > /tmp/patch-failures.txt

          total=0
          while IFS= read -r -d '' deb; do
            total=$((total + 1))
            outcome=$(bash /tmp/patch_one.sh "$deb" 2>/tmp/patch-err)
            printf '%s\t%s\n' "$outcome" "$deb" >> /tmp/patch-outcomes.txt
            case "$outcome" in
              OK|OK-GZIP) ;;
              *) echo "$outcome: $deb" >> /tmp/patch-failures.txt ;;
            esac
            if [ $((total % 100)) -eq 0 ]; then
              echo ">>> patched $total files so far..."
            fi
          done < <(find "$SRC_ROOT" -type f -name '*.deb' -print0)

          echo ""
          echo ">>> patch summary:"
          awk -F'\t' '{print $1}' /tmp/patch-outcomes.txt | sort | uniq -c | sort -rn
          echo ">>> failures: $(wc -l < /tmp/patch-failures.txt)"
          if [ -s /tmp/patch-failures.txt ]; then
            head -10 /tmp/patch-failures.txt
            echo "::error::patching failed — refusing to continue"
            exit 1
          fi
          echo ">>> all $total files patched successfully"

      - name: Stage pool tree
        if: ${{ inputs.mode != 'metadata-only' }}
        run: |
          set -euo pipefail
          POOL=/tmp/pool-tree
          rm -rf "$POOL"; mkdir -p "$POOL"
          while IFS='|' read -r target tag; do
            [ -z "$tag" ] && continue
            comp=""
            case "$tag" in
              xodos-XoDos-main-p*) comp=main ;;
              xodos-XoDos-x11-p*) comp=main ;;
              xodos-XoDos-root-p*) comp=stable ;;
              xodos-XoDos-glibc-p*) comp=main ;;
              xodos-XoDos-tur-continuous-p*) comp=tur-continuous ;;
              xodos-XoDos-tur-on-device-p*) comp=tur-on-device ;;
              xodos-XoDos-tur-p*) comp=tur ;;
            esac
            [ -z "$comp" ] && continue
            src="/tmp/gh-debs/${target}"
            [ -d "$src" ] || continue
            shopt -s nullglob
            for deb in "$src"/*.deb; do
              pkg=$(dpkg-deb -f "$deb" Package 2>/dev/null || echo "")
              [ -z "$pkg" ] && continue
              fl=$(printf '%s' "$pkg" | cut -c1 | tr 'A-Z' 'a-z')
              dest="$POOL/${target}/pool/${comp}/${fl}/${pkg}"
              mkdir -p "$dest"
              cp -a "$deb" "$dest/" 2>/dev/null || true
            done
            shopt -u nullglob
          done < "$WORK_DIR/tags-for-run.txt"
          echo ">>> .deb staged: $(find "$POOL" -type f -name '*.deb' | wc -l)"

      - name: Build dists metadata
        run: |
          set -euo pipefail
          BUILD=/tmp/aptrepo
          rm -rf "$BUILD"; mkdir -p "$BUILD"
          if [ "$MODE" = "metadata-only" ]; then SRC_ROOT=/tmp/hf-debs; else SRC_ROOT=/tmp/pool-tree; fi
          : > "$WORK_DIR/targets-built.txt"
          : > "$WORK_DIR/targets-missing.txt"

          while read -r target dist comp; do
            [ -z "$target" ] && continue
            pooldir="$SRC_ROOT/${target}/pool/${comp}"
            if [ ! -d "$pooldir" ]; then
              echo ">>> skip $target/$comp (no pool at $pooldir)"
              continue
            fi
            outd="$BUILD/$target/dists/$dist/$comp/binary-aarch64"
            mkdir -p "$outd"; : > "$outd/Packages"
            tsv="/tmp/t-${target}-${comp}.tsv"; : > "$tsv"
            shopt -s nullglob
            for deb in "$pooldir"/*/*/*.deb; do
              dpkg-deb -I "$deb" >/dev/null 2>&1 || continue
              printf '%s\t%s\t%s\n' \
                "$(dpkg-deb -f "$deb" Package)" \
                "$(dpkg-deb -f "$deb" Version)" \
                "$deb" >> "$tsv"
            done
            shopt -u nullglob
            in_n=$(wc -l < "$tsv"); echo ">>> $target/$comp: input=$in_n"
            [ "$in_n" -eq 0 ] && continue
            sort -t$'\t' -k1,1 -k2,2rV "$tsv" | awk -F'\t' '!seen[$1]++' > "${tsv}.w"
            placed=0
            while IFS=$'\t' read -r pkg ver deb; do
              [ -z "$pkg" ] && continue
              fname=$(basename "$deb")
              fl=$(printf '%s' "$pkg" | cut -c1 | tr 'A-Z' 'a-z')
              relpath="pool/${comp}/${fl}/${pkg}/${fname}"
              size=$(stat -c %s "$deb")
              md5=$(md5sum "$deb" | awk '{print $1}')
              sha1=$(sha1sum "$deb" | awk '{print $1}')
              sha256=$(sha256sum "$deb" | awk '{print $1}')
              dpkg-deb -f "$deb" >> "$outd/Packages"
              {
                echo "Filename: ${relpath}"
                echo "Size: ${size}"
                echo "MD5sum: ${md5}"
                echo "SHA1: ${sha1}"
                echo "SHA256: ${sha256}"
                echo ""
              } >> "$outd/Packages"
              placed=$((placed + 1))
            done < "${tsv}.w"
            echo "    placed: $placed"
            gzip -kf -9 "$outd/Packages"
            rm -f "$outd/Packages.xz" "$tsv" "${tsv}.w"
          done < "$WORK_DIR/dist-comp.txt"

          cd "$BUILD"
          while read -r target; do
            [ -z "$target" ] && continue
            [ -d "$target/dists" ] || continue
            for dist_dir in "$target"/dists/*/; do
              [ -d "$dist_dir" ] || continue
              dist="$(basename "$dist_dir")"; comps=""
              for comp_dir in "$dist_dir"*/; do
                [ -d "$comp_dir" ] || continue
                c="$(basename "$comp_dir")"
                [ -s "$comp_dir/binary-aarch64/Packages" ] && comps="${comps}${comps:+ }$c"
              done
              [ -z "$comps" ] && continue
              conf="/tmp/rel-${target}-${dist}.conf"
              {
                echo 'APT::FTPArchive::Release::Origin "xodos";'
                echo "APT::FTPArchive::Release::Label \"xodos ${target}/${dist}\";"
                echo "APT::FTPArchive::Release::Suite \"${dist}\";"
                echo "APT::FTPArchive::Release::Codename \"${dist}\";"
                echo 'APT::FTPArchive::Release::Architectures "aarch64";'
                echo "APT::FTPArchive::Release::Components \"${comps}\";"
                echo "APT::FTPArchive::Release::Description \"xodos ${target} (${dist})\";"
              } > "$conf"
              apt-ftparchive -c "$conf" release "$target/dists/$dist" > "$target/dists/$dist/Release"
              cp "$target/dists/$dist/Release" "$target/dists/$dist/InRelease"
            done
          done < "$WORK_DIR/targets.txt"

          while read -r target; do
            [ -z "$target" ] && continue
            if [ -d "$target/dists" ] && \
               find "$target/dists" -type f -name Release | grep -q . && \
               find "$target/dists" -type f -name InRelease | grep -q .; then
              echo ">>> OK      $target"
              echo "$target" >> "$WORK_DIR/targets-built.txt"
            else
              echo ">>> MISSING $target"
              echo "$target" >> "$WORK_DIR/targets-missing.txt"
            fi
          done < "$WORK_DIR/targets.txt"

          sort -u "$WORK_DIR/targets-built.txt" -o "$WORK_DIR/targets-built.txt"
          echo ""
          echo ">>> targets-built.txt has $(wc -l < "$WORK_DIR/targets-built.txt") entries"
          sed 's/^/    /' "$WORK_DIR/targets-built.txt"

      - name: Sanity check
        run: |
          set -euo pipefail
          n=$(wc -l < "$WORK_DIR/targets-built.txt")
          if [ "$n" -eq 0 ]; then
            echo "::error::Nothing was built — targets-built.txt is empty"
            echo "::error::Check the 'Build dists metadata' step above"
            echo ">>> targets-missing.txt:"
            cat "$WORK_DIR/targets-missing.txt" || true
            exit 1
          fi
          echo ">>> OK: $n target(s) ready to upload"

      - name: Validate .deb before upload
        run: |
          set -euo pipefail
          bad=0; total=0
          while IFS= read -r -d '' deb; do
            total=$((total + 1))
            head=$(head -c 8 "$deb")
            [ "$head" != "!<arch>" ] && { echo "::error::NOT A DEB: $deb"; bad=$((bad + 1)); continue; }
            dpkg-deb -I "$deb" >/dev/null 2>&1 || { echo "::error::INVALID: $deb"; bad=$((bad + 1)); }
          done < <(find /tmp/aptrepo -type f -name '*.deb' -print0 2>/dev/null || true)
          echo ">>> checked $total, bad=$bad"
          [ "$bad" -gt 0 ] && { echo "::error::refusing to upload"; exit 1; }
          echo ">>> all valid"

      - name: Upload to Hugging Face
        run: |
          set -euo pipefail
          cat > /tmp/upload.py << 'PYEOF'
          import os, time
          from huggingface_hub import HfApi

          api = HfApi()
          repo = os.environ["HF_REPO"]
          token = os.environ["HF_TOKEN"]
          mode = os.environ["MODE"]
          work = os.environ["WORK_DIR"]
          force_push = os.environ["FORCE_PUSH"].lower() == "true"

          api.create_repo(repo_id=repo, repo_type="dataset", exist_ok=True, token=token)
          built = [l.strip() for l in open(work + "/targets-built.txt") if l.strip()]

          print(f">>> HF repo: {repo}")
          print(f">>> mode: {mode}   force_push: {force_push}")
          print(f">>> built targets: {built}")
          if not built:
              print("::error::built is empty — nothing to upload")
              raise SystemExit(1)

          def local_pool_dir(t):
              p = ("/tmp/hf-debs/" + t + "/pool") if mode == "metadata-only" else ("/tmp/pool-tree/" + t + "/pool")
              return p if os.path.isdir(p) else None

          def local_dists_dir(t):
              p = "/tmp/aptrepo/" + t + "/dists"
              return p if os.path.isdir(p) else None

          def upload_folder_any(folder_path, path_in_repo, label):
              if hasattr(api, "upload_large_folder"):
                  os.environ["HF_TOKEN"] = token
                  print(f"    [{label}] upload_large_folder")
                  api.upload_large_folder(
                      folder_path=folder_path, repo_id=repo,
                      repo_type="dataset", path_in_repo=path_in_repo, num_workers=4,
                  )
              else:
                  print(f"    [{label}] upload_folder")
                  api.upload_folder(
                      folder_path=folder_path, repo_id=repo,
                      repo_type="dataset", path_in_repo=path_in_repo,
                      token=token, commit_message=f"Upload {path_in_repo}",
                  )

          def with_retry(fn, label):
              for attempt in range(1, 6):
                  try: fn(); return
                  except Exception as e:
                      msg = str(e)
                      if "429" in msg or "rate limit" in msg.lower():
                          print(f"    [{label}] rate limited, sleeping {attempt*60}s")
                          time.sleep(attempt * 60)
                      else:
                          print(f"    [{label}] FAILED: {type(e).__name__}: {e}")
                          raise
              raise SystemExit(f"::error::{label} failed after 5 attempts")

          for t in built:
              if force_push:
                  print(f">>> FORCE PUSH: clearing {t}/** on HF")
                  try:
                      api.delete_files(repo_id=repo, repo_type="dataset",
                                       delete_patterns=[t + "/**"], token=token,
                                       commit_message=f"Force push: clear {t}")
                      print(f">>> cleared {t}/**")
                  except Exception as e:
                      print(f">>> WARN clear {t}: {type(e).__name__} {e}")
              else:
                  print(f">>> clearing {t}/dists/** on HF")
                  try:
                      api.delete_files(repo_id=repo, repo_type="dataset",
                                       delete_patterns=[t + "/dists/**"], token=token,
                                       commit_message=f"Clear {t} dists")
                      print(f">>> cleared {t}/dists/**")
                  except Exception as e:
                      print(f">>> WARN clear {t}/dists: {type(e).__name__} {e}")

          if mode == "pool-only":
              for t in built:
                  lp = local_pool_dir(t)
                  if lp:
                      print(f">>> uploading {t}/pool/ ...")
                      with_retry(lambda t=t, lp=lp: upload_folder_any(lp, t + "/pool", f"pool {t}"), f"pool {t}")
                      print(f">>> uploaded {t}/pool/")
              print(">>> done (pool-only)")
              raise SystemExit(0)

          for t in built:
              if mode == "full":
                  lp = local_pool_dir(t)
                  if lp:
                      print(f">>> uploading {t}/pool/ ...")
                      with_retry(lambda t=t, lp=lp: upload_folder_any(lp, t + "/pool", f"pool {t}"), f"pool {t}")
                      print(f">>> uploaded {t}/pool/")
              ld = local_dists_dir(t)
              if ld:
                  print(f">>> uploading {t}/dists/ ...")
                  with_retry(lambda t=t, ld=ld: upload_folder_any(ld, t + "/dists", f"dists {t}"), f"dists {t}")
                  print(f">>> uploaded {t}/dists/")
          print(">>> done")
          PYEOF
          python3 /tmp/upload.py

      - name: Verify URLs
        run: |
          set -euo pipefail
          base="https://huggingface.co/datasets/${HF_REPO}/resolve/main"
          fail=0
          while read -r target dist comp; do
            [ -z "$target" ] && continue
            grep -qx "$target" "$WORK_DIR/targets-built.txt" || { echo "  SKIP  $target"; continue; }
            for f in "Release" "InRelease" "${comp}/binary-aarch64/Packages.gz"; do
              url="${base}/${target}/dists/${dist}/${f}?t=$(date +%s)"
              code=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
              printf '  %s  %s\n' "$code" "${target}/dists/${dist}/${f}"
              [ "$code" = "200" ] || fail=$((fail+1))
            done
          done < "$WORK_DIR/dist-comp.txt"

          echo ""
          echo ">>> sample .deb URL sanity:"
          for target in $(cat "$WORK_DIR/targets-built.txt"); do
            sample=$(find "/tmp/aptrepo/$target" -name Packages | head -1)
            [ -z "$sample" ] && continue
            grep '^Filename:' "$sample" > /tmp/sample-fname.txt || true
            [ ! -s /tmp/sample-fname.txt ] && { echo "  MISSING Filename: in $sample"; fail=$((fail+1)); continue; }
            fname=$(head -1 /tmp/sample-fname.txt | sed 's/^Filename: //')
            url="${base}/${target}/${fname}?t=$(date +%s)"
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
            printf '  %s  %s/%s\n' "$code" "$target" "$fname"
            [ "$code" = "200" ] || fail=$((fail+1))
          done

          [ "$fail" -gt 0 ] && { echo "::error::$fail URLs unreachable"; exit 1; }
          echo ">>> all URLs OK"

      - name: Summary
        run: |
          {
            echo "## APT Repository Regenerated"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Mode** | \`${{ inputs.mode }}\` |"
            echo "| **Repos** | \`${{ inputs.repos }}\` |"
            echo "| **Patch prefix** | \`${{ inputs.patch_prefix }}\` |"
            echo "| **Force push** | \`${{ inputs.force_push }}\` |"
            echo "| **Clean HF** | \`${{ inputs.clean_hf }}\` |"
            echo ""
            echo "### Built this run"
            echo '```'
            cat "$WORK_DIR/targets-built.txt" 2>/dev/null || echo "(none)"
            echo '```'
            if [ -s "$WORK_DIR/targets-missing.txt" ]; then
              echo "### Missing"
              echo '```'
              cat "$WORK_DIR/targets-missing.txt"
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
