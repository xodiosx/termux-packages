name: Build APT Repository and Publish to Hugging Face

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repo that hosts release tags (owner/name)"
        required: true
        default: "xodiosx/termux-packages"
      hf_repo_id:
        description: "Hugging Face dataset repo (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      tags:
        description: "Space/comma tags. Empty = auto-discover xodos-XoDos-* tags."
        required: false
        default: ""
      repos:
        description: "Sub-repos to include (comma-separated)"
        required: false
        default: "main,x11,root,glibc"
      clean_hf:
        description: "DELETE EVERYTHING on Hugging Face before uploading (removes old scattered .deb files)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dpkg-dev apt-utils gzip zstd jq
        pip install -q --upgrade "huggingface_hub[cli]<1.0"
        huggingface-cli --help > /tmp/hf-help.txt 2>&1 || true
        head -3 /tmp/hf-help.txt || true

    # ==================================================================
    # 1. Resolve tags
    # ==================================================================
    - name: Resolve tags
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SRC: ${{ inputs.source_repo }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_REPOS: ${{ inputs.repos }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/plan
        : > /tmp/plan/groups.txt

        if [ -n "$INPUT_TAGS" ]; then
          read -a TAGS <<< "${INPUT_TAGS//,/ }"
        else
          REPOS_ALT=$(echo "$INPUT_REPOS" | tr ',' '|')
          mapfile -t TAGS < <(
            gh release list --repo "$SRC" --limit 1000 \
              --json tagName,createdAt \
              --jq "sort_by(.createdAt) | .[].tagName | select(test(\"^xodos-XoDos-(${REPOS_ALT})-p[0-9]+-\"))"
          )
        fi

        if [ "${#TAGS[@]}" -eq 0 ]; then
          echo "::error::No tags found"
          exit 1
        fi

        for tag in "${TAGS[@]}"; do
          case "$tag" in
            xodos-XoDos-main-p*)  printf 'main\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-x11-p*)   printf 'x11\t%s\n'   "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-root-p*)  printf 'root\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-glibc-p*) printf 'glibc\t%s\n' "$tag" >> /tmp/plan/groups.txt ;;
            *) echo ">>> WARNING: unparsed tag: $tag" ;;
          esac
        done

        cut -f1 /tmp/plan/groups.txt | sort -u > /tmp/plan/repos.txt
        echo ">>> Tags per repo:"
        sort /tmp/plan/groups.txt | sed 's/^/    /'

    # ==================================================================
    # 2. Download every .deb from GitHub Releases
    # ==================================================================
    - name: Download .deb files from GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SRC: ${{ inputs.source_repo }}
      run: |
        set -euo pipefail
        rm -rf /tmp/raw-debs
        mkdir -p /tmp/raw-debs

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          echo ">>> repo: $repo"
          mkdir -p "/tmp/raw-debs/$repo"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "    downloading: $tag"
            tmpdir=$(mktemp -d)
            if gh release download "$tag" --repo "$SRC" \
                 --pattern "*.deb" --dir "$tmpdir" 2>/tmp/dl_err.log
            then
              n=$(find "$tmpdir" -maxdepth 1 -type f -name '*.deb' | wc -l)
              echo "    got $n .deb"
              find "$tmpdir" -maxdepth 1 -type f -name '*.deb' -print0 \
                | xargs -0r mv -t "/tmp/raw-debs/$repo/"
            else
              echo "    WARN: download failed for $tag"
              head -3 /tmp/dl_err.log | sed 's/^/        /' || true
            fi
            rm -rf "$tmpdir"
          done < <(grep -P "^${repo}\t" /tmp/plan/groups.txt | cut -f2)

          total=$(find "/tmp/raw-debs/$repo" -maxdepth 1 -type f -name '*.deb' | wc -l)
          echo "    repo $repo total: $total"
        done < /tmp/plan/repos.txt

    # ==================================================================
    # 3. Build the full APT repo (dists + pool) for each sub-repo
    # ==================================================================
    - name: Build full APT repository
      run: |
        set -euo pipefail
        BUILD=/tmp/aptrepo
        rm -rf "$BUILD"
        mkdir -p "$BUILD"
        : > /tmp/override.empty

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          case "$repo" in
            main)  dist=stable; comp=main ;;
            x11)   dist=x11;    comp=main ;;
            root)  dist=root;   comp=stable ;;
            glibc) dist=glibc;  comp=main ;;
            *)     continue ;;
          esac

          echo "=================================================="
          echo ">>> building: xodos-${repo}  (dist=$dist comp=$comp)"
          echo "=================================================="

          outdir="$BUILD/xodos-${repo}"
          pooldir="$outdir/pool/${comp}"
          mkdir -p "$pooldir"

          # Dedup by package name, keep highest version
          tsv="/tmp/all-${repo}.tsv"
          : > "$tsv"
          shopt -s nullglob
          for deb in /tmp/raw-debs/"$repo"/*.deb; do
            dpkg-deb -I "$deb" >/dev/null 2>&1 || continue
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            printf '%s\t%s\t%s\n' "$pkg" "$ver" "$deb" >> "$tsv"
          done
          shopt -u nullglob

          winners="/tmp/winners-${repo}.tsv"
          sort -t$'\t' -k1,1 -k2,2rV "$tsv" | awk -F'\t' '!seen[$1]++' > "$winners"

          placed=0
          while IFS=$'\t' read -r pkg ver path; do
            [ -z "$pkg" ] && continue
            first_letter=$(printf '%s' "$pkg" | cut -c1 | tr 'A-Z' 'a-z')
            dest_dir="${pooldir}/${first_letter}/${pkg}"
            mkdir -p "$dest_dir"
            cp -a "$path" "$dest_dir/"
            placed=$((placed + 1))
          done < "$winners"
          echo ">>> placed ${placed} unique packages in pool"

          # Generate Packages for aarch64 (includes arch:all)
          dists="$outdir/dists/${dist}/${comp}"
          mkdir -p "$dists/binary-aarch64" "$dists/binary-all"

          cd "$outdir"
          dpkg-scanpackages --multiversion "pool/${comp}" /tmp/override.empty \
            > "dists/${dist}/${comp}/binary-aarch64/Packages"
          dpkg-scanpackages --multiversion --arch all "pool/${comp}" /tmp/override.empty \
            > "dists/${dist}/${comp}/binary-all/Packages"
          cd - >/dev/null

          # Compress (gzip only — GH Pages / HF both handle .gz fine)
          gzip -kf -9 "$dists/binary-aarch64/Packages"
          gzip -kf -9 "$dists/binary-all/Packages"
          rm -f "$dists/binary-aarch64/Packages.xz" "$dists/binary-all/Packages.xz"

          echo "    binary-aarch64: $(grep -c '^Package:' "$dists/binary-aarch64/Packages" || true) entries"
          echo "    binary-all:     $(grep -c '^Package:' "$dists/binary-all/Packages" || true) entries"

          # Release file
          conf="/tmp/release-${repo}.conf"
          {
            echo 'APT::FTPArchive::Release::Origin "xodos";'
            echo "APT::FTPArchive::Release::Label \"xodos Termux ${repo}\";"
            echo "APT::FTPArchive::Release::Suite \"${dist}\";"
            echo "APT::FTPArchive::Release::Codename \"${dist}\";"
            echo 'APT::FTPArchive::Release::Architectures "aarch64 all";'
            echo "APT::FTPArchive::Release::Components \"${comp}\";"
            echo "APT::FTPArchive::Release::Description \"xodos Termux ${repo} packages\";"
          } > "$conf"

          cd "$outdir"
          apt-ftparchive -c "$conf" release "dists/${dist}" > "dists/${dist}/Release"
          cp "dists/${dist}/Release" "dists/${dist}/InRelease"
          cd - >/dev/null
          echo ">>> Release written: ${outdir}/dists/${dist}/Release"
        done < /tmp/plan/repos.txt

        echo ""
        echo ">>> final build tree:"
        find "$BUILD" -maxdepth 3 -type d | sort | sed 's/^/    /'
        echo ""
        echo ">>> total size: $(du -sh "$BUILD" | awk '{print $1}')"

    # ==================================================================
    # 4. Create HF repo if needed
    # ==================================================================
    - name: Create HF dataset repo (idempotent)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: ${{ inputs.hf_repo_id }}
      run: |
        set -euo pipefail
        huggingface-cli repo create "$HF_REPO" --repo-type dataset --exist-ok --token "$HF_TOKEN"
        echo ">>> HF repo ready: https://huggingface.co/datasets/$HF_REPO"

    # ==================================================================
    # 5. Prepare staging dir (with README)
    # ==================================================================
    - name: Stage for upload
      run: |
        set -euo pipefail
        STAGE=/tmp/hf-stage
        rm -rf "$STAGE"
        mkdir -p "$STAGE"
        cp -a /tmp/aptrepo/. "$STAGE"/

        {
          echo '# xodos-packages'
          echo ''
          echo 'APT repository for xodos Termux packages.'
          echo ''
          echo '## sources.list entries'
          echo ''
          echo '```'
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-main stable main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-x11 x11 main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-root root stable"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-glibc glibc main"
          echo '```'
        } > "$STAGE/README.md"

        echo ">>> staging tree:"
        find "$STAGE" -maxdepth 2 -type d | sort | sed 's/^/    /'
        echo ""
        echo ">>> staging size: $(du -sh "$STAGE" | awk '{print $1}')"

    # ==================================================================
    # 6. Upload to Hugging Face
    #    clean_hf=true  → --delete "*" wipes HF repo first
    #    clean_hf=false → merges (leaves old files in place)
    # ==================================================================
    - name: Upload to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: ${{ inputs.hf_repo_id }}
        CLEAN_HF: ${{ inputs.clean_hf }}
      run: |
        set -euo pipefail
        STAGE=/tmp/hf-stage

        if [ "$CLEAN_HF" = "true" ]; then
          echo "=================================================="
          echo ">>> clean_hf=true — DELETING EVERYTHING on HF first"
          echo "=================================================="

          # huggingface-cli upload supports --delete <pattern>
          # Using --delete "*" then uploading the new tree means:
          # 1. Delete all existing files on HF
          # 2. Upload the new tree
          # Doing it in one command with an empty local dir isn't
          # reliable across CLI versions, so we do it in two steps.

          # Step 1: upload an empty directory with --delete "*"
          EMPTY=$(mktemp -d)
          echo ">>> wiping remote files..."
          huggingface-cli upload "$HF_REPO" "$EMPTY" . \
            --repo-type dataset \
            --token "$HF_TOKEN" \
            --delete "*" || true
          rm -rf "$EMPTY"
          echo ">>> remote wiped"
        fi

        echo ">>> uploading new tree to $HF_REPO ..."
        huggingface-cli upload "$HF_REPO" "$STAGE" . \
          --repo-type dataset \
          --token "$HF_TOKEN"

        echo ">>> upload complete"

    - name: Verify
      run: |
        echo ">>> checking a few files are live..."
        for f in \
          "xodos-main/dists/stable/Release" \
          "xodos-main/dists/stable/main/binary-aarch64/Packages.gz" \
          "xodos-x11/dists/x11/Release" \
          "xodos-root/dists/root/Release" \
          "xodos-glibc/dists/glibc/Release"; do
          url="https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/$f"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "  $code  $url"
        done

    - name: Summary
      run: |
        {
          echo "## APT Repository on Hugging Face"
          echo ""
          echo "- Source tags: \`${{ inputs.source_repo }}\`"
          echo "- HF repo: https://huggingface.co/datasets/${{ inputs.hf_repo_id }}"
          echo "- clean_hf: \`${{ inputs.clean_hf }}\`"
          echo ""
          echo "### sources.list"
          echo '```'
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-main stable main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-x11 x11 main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-root root stable"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-glibc glibc main"
          echo '```'
        } >> $GITHUB_STEP_SUMMARY
