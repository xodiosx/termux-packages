name: Build APT Repository on Hugging Face

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repo that hosts release tags (owner/name)"
        required: true
        default: "xodiosx/termux-packages"
      hf_repo_id:
        description: "Hugging Face dataset repo (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      tags:
        description: "Space/comma tags. Empty = auto-discover xodos-XoDos-* tags."
        required: false
        default: ""
      repos:
        description: "Sub-repos to include (comma-separated)"
        required: false
        default: "main,x11,root,glibc"
      wipe_hf:
        description: "WARNING: delete ALL files on HF before uploading. Keep FALSE to preserve existing .deb files."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    env:
      HF_REPO: ${{ inputs.hf_repo_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SRC: ${{ inputs.source_repo }}
    steps:

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dpkg-dev apt-utils gzip zstd jq curl unzip
        pip install -q --upgrade "huggingface_hub<1.0"
        python3 -c 'import huggingface_hub; print("huggingface_hub", huggingface_hub.__version__)'

    # ==================================================================
    # 1. Resolve tags
    # ==================================================================
    - name: Resolve tags
      env:
        GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_REPOS: ${{ inputs.repos }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/plan
        : > /tmp/plan/groups.txt

        echo ">>> checking access to $SRC ..."
        gh api "repos/$SRC" --jq '.full_name' >/dev/null 2>&1 || {
          echo "::error::cannot access $SRC — set SOURCE_REPO_TOKEN with read access"
          exit 1
        }

        if [ -n "$INPUT_TAGS" ]; then
          read -a TAGS <<< "${INPUT_TAGS//,/ }"
        else
          REPOS_ALT=$(echo "$INPUT_REPOS" | tr ',' '|')
          mapfile -t TAGS < <(
            gh release list --repo "$SRC" --limit 1000 \
              --json tagName,createdAt \
              --jq "sort_by(.createdAt) | .[].tagName | select(test(\"^xodos-XoDos-(${REPOS_ALT})-p[0-9]+-\"))"
          )
        fi

        if [ "${#TAGS[@]}" -eq 0 ]; then
          echo "::error::no tags found"; exit 1
        fi

        for tag in "${TAGS[@]}"; do
          case "$tag" in
            xodos-XoDos-main-p*)  printf 'main\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-x11-p*)   printf 'x11\t%s\n'   "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-root-p*)  printf 'root\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-glibc-p*) printf 'glibc\t%s\n' "$tag" >> /tmp/plan/groups.txt ;;
          esac
        done
        cut -f1 /tmp/plan/groups.txt | sort -u > /tmp/plan/repos.txt
        echo ">>> groups:"
        sort /tmp/plan/groups.txt | sed 's/^/    /'

    # ==================================================================
    # 2. Optionally wipe HF (default false)
    # ==================================================================
    - name: Wipe HF repo
      if: ${{ inputs.wipe_hf }}
      run: |
        set -euo pipefail
        python3 -c "
        import os
        from huggingface_hub import HfApi
        from huggingface_hub.utils import RepositoryNotFoundError
        api = HfApi()
        repo = os.environ['HF_REPO']; token = os.environ['HF_TOKEN']
        try:
            api.delete_repo(repo_id=repo, repo_type='dataset', token=token)
            print('>>> deleted:', repo)
        except RepositoryNotFoundError:
            print('>>> repo did not exist')
        api.create_repo(repo_id=repo, repo_type='dataset', exist_ok=True, token=token)
        print('>>> recreated empty:', repo)
        "

    # ==================================================================
    # 3. Download from GitHub Releases (accepts .deb and archives)
    # ==================================================================
    - name: Download from GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        rm -rf /tmp/raw-debs
        mkdir -p /tmp/raw-debs

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          echo "=================================================="
          echo ">>> repo: $repo"
          echo "=================================================="
          mkdir -p "/tmp/raw-debs/$repo"

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo ">>> tag: $tag"

            tmpdir=$(mktemp -d)
            if ! gh release download "$tag" --repo "$SRC" --dir "$tmpdir" 2>/tmp/dl_err.log; then
              echo "    FAIL: $tag"
              head -5 /tmp/dl_err.log | sed 's/^/        /' || true
              rm -rf "$tmpdir"; continue
            fi

            echo "    release assets:"
            find "$tmpdir" -maxdepth 1 -type f -printf '        %f  (%s bytes)\n'

            # Direct .deb files
            direct=$(find "$tmpdir" -maxdepth 1 -type f -name '*.deb' | wc -l)
            if [ "$direct" -gt 0 ]; then
              echo "    direct .deb: $direct"
              find "$tmpdir" -maxdepth 1 -type f -name '*.deb' -print0 \
                | xargs -0r mv -t "/tmp/raw-debs/$repo/"
            fi

            # Fallback: extract archives if any (this run or future ones)
            shopt -s nullglob
            for arc in "$tmpdir"/*.tar.xz "$tmpdir"/*.tar.gz "$tmpdir"/*.tgz "$tmpdir"/*.zip; do
              [ -f "$arc" ] || continue
              echo "    extracting $(basename "$arc")"
              ex="$tmpdir/ex"; rm -rf "$ex"; mkdir -p "$ex"
              case "$arc" in
                *.tar.xz)       tar -xJf "$arc" -C "$ex" ;;
                *.tar.gz|*.tgz) tar -xzf "$arc" -C "$ex" ;;
                *.zip)          unzip -q "$arc" -d "$ex" ;;
              esac
              n=$(find "$ex" -type f -name '*.deb' | wc -l)
              echo "        extracted $n .deb"
              find "$ex" -type f -name '*.deb' -print0 | xargs -0r mv -t "/tmp/raw-debs/$repo/"
              rm -rf "$ex"
            done
            shopt -u nullglob

            rm -rf "$tmpdir"
          done < <(grep -P "^${repo}\t" /tmp/plan/groups.txt | cut -f2)

          echo ">>> repo $repo total: $(find "/tmp/raw-debs/$repo" -maxdepth 1 -type f -name '*.deb' | wc -l)"
        done < /tmp/plan/repos.txt

        grand=$(find /tmp/raw-debs -type f -name '*.deb' | wc -l)
        echo ""
        echo ">>> grand total downloaded: $grand .deb files"
        if [ "$grand" -eq 0 ]; then
          echo "::error::0 .deb downloaded — refusing to continue"
          exit 1
        fi

    # ==================================================================
    # 4. Build full APT tree
    # ==================================================================
    - name: Build APT repository tree
      run: |
        set -euo pipefail
        BUILD=/tmp/aptrepo
        rm -rf "$BUILD"
        mkdir -p "$BUILD"
        : > /tmp/override.empty

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          case "$repo" in
            main)  dist=stable; comp=main ;;
            x11)   dist=x11;    comp=main ;;
            root)  dist=root;   comp=stable ;;
            glibc) dist=glibc;  comp=main ;;
            *)     continue ;;
          esac

          outdir="$BUILD/xodos-${repo}"
          pooldir="$outdir/pool/${comp}"
          mkdir -p "$pooldir"

          tsv="/tmp/all-${repo}.tsv"; : > "$tsv"
          shopt -s nullglob
          for deb in /tmp/raw-debs/"$repo"/*.deb; do
            dpkg-deb -I "$deb" >/dev/null 2>&1 || continue
            printf '%s\t%s\t%s\n' \
              "$(dpkg-deb -f "$deb" Package)" \
              "$(dpkg-deb -f "$deb" Version)" \
              "$deb" >> "$tsv"
          done
          shopt -u nullglob

          n=$(wc -l < "$tsv")
          echo ">>> $repo: $n valid .deb"
          [ "$n" -eq 0 ] && { echo "::error::empty for $repo"; exit 1; }

          winners="/tmp/winners-${repo}.tsv"
          sort -t$'\t' -k1,1 -k2,2rV "$tsv" | awk -F'\t' '!seen[$1]++' > "$winners"

          placed=0
          while IFS=$'\t' read -r pkg ver path; do
            [ -z "$pkg" ] && continue
            fl=$(printf '%s' "$pkg" | cut -c1 | tr 'A-Z' 'a-z')
            dd="${pooldir}/${fl}/${pkg}"
            mkdir -p "$dd"
            cp -a "$path" "$dd/"
            placed=$((placed + 1))
          done < "$winners"
          echo ">>> $repo pool: $(find "$pooldir" -type f -name '*.deb' | wc -l) .deb"

          dists="$outdir/dists/${dist}/${comp}"
          mkdir -p "$dists/binary-aarch64" "$dists/binary-all"

          cd "$outdir"
          dpkg-scanpackages --multiversion "pool/${comp}" /tmp/override.empty > "dists/${dist}/${comp}/binary-aarch64/Packages"
          dpkg-scanpackages --multiversion --arch all "pool/${comp}" /tmp/override.empty > "dists/${dist}/${comp}/binary-all/Packages"
          cd - >/dev/null

          gzip -kf -9 "$dists/binary-aarch64/Packages"
          gzip -kf -9 "$dists/binary-all/Packages"
          rm -f "$dists/binary-aarch64/Packages.xz" "$dists/binary-all/Packages.xz"

          echo ">>> $repo entries: $(grep -c '^Package:' "$dists/binary-aarch64/Packages" || true)"

          conf="/tmp/release-${repo}.conf"
          {
            echo 'APT::FTPArchive::Release::Origin "xodos";'
            echo "APT::FTPArchive::Release::Label \"xodos Termux ${repo}\";"
            echo "APT::FTPArchive::Release::Suite \"${dist}\";"
            echo "APT::FTPArchive::Release::Codename \"${dist}\";"
            echo 'APT::FTPArchive::Release::Architectures "aarch64 all";'
            echo "APT::FTPArchive::Release::Components \"${comp}\";"
            echo "APT::FTPArchive::Release::Description \"xodos Termux ${repo}\";"
          } > "$conf"

          cd "$outdir"
          apt-ftparchive -c "$conf" release "dists/${dist}" > "dists/${dist}/Release"
          cp "dists/${dist}/Release" "dists/${dist}/InRelease"
          cd - >/dev/null
        done < /tmp/plan/repos.txt

        cat > "$BUILD/README.md" <<'EOF'
        # xodos-packages

        APT repository for xodos Termux packages (aarch64).
        EOF

        echo ""
        echo ">>> total .deb: $(find "$BUILD" -type f -name '*.deb' | wc -l)"
        echo ">>> total size: $(du -sh "$BUILD" | awk '{print $1}')"

    - name: Ensure HF repo exists
      run: |
        set -euo pipefail
        python3 -c "
        import os
        from huggingface_hub import HfApi
        HfApi().create_repo(repo_id=os.environ['HF_REPO'], repo_type='dataset', exist_ok=True, token=os.environ['HF_TOKEN'])
        print('>>> repo ready')
        "

    # ==================================================================
    # 5. Upload (upload_large_folder — no token arg)
    # ==================================================================
    - name: Upload to Hugging Face
      run: |
        set -euo pipefail
        echo ">>> pre-upload check:"
        echo "    .deb: $(find /tmp/aptrepo -type f -name '*.deb' | wc -l)"
        echo "    all:  $(find /tmp/aptrepo -type f | wc -l)"
        echo "    size: $(du -sh /tmp/aptrepo | awk '{print $1}')"

        if [ "$(find /tmp/aptrepo -type f -name '*.deb' | wc -l)" -eq 0 ]; then
          echo "::error::nothing to upload"; exit 1
        fi

        python3 -c "
        import os
        from huggingface_hub import HfApi
        api = HfApi()
        print('>>> starting upload_large_folder...')
        api.upload_large_folder(
            folder_path='/tmp/aptrepo',
            repo_id=os.environ['HF_REPO'],
            repo_type='dataset',
            num_workers=4,
        )
        print('>>> upload complete')
        "

    - name: Verify
      run: |
        set -euo pipefail
        python3 -c "
        import os
        from huggingface_hub import HfApi
        files = list(HfApi().list_repo_files(repo_id=os.environ['HF_REPO'], repo_type='dataset', token=os.environ['HF_TOKEN']))
        print('>>> total files on HF:', len(files))
        deb = [f for f in files if f.endswith('.deb')]
        print('>>> .deb on HF:', len(deb))
        for f in deb[:10]: print('    ', f)
        if not deb:
            raise SystemExit('::error::no .deb on HF')
        "
