name: Regenerate APT Repository on Hugging Face

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        type: choice
        default: metadata-only
        options:
          - metadata-only
          - full
          - pool-only
      hf_repo_id:
        description: "Hugging Face dataset repo (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      repos:
        description: "Repos to process (comma-separated)"
        required: true
        default: "main,x11,root,glibc,tur,tur-on-device,tur-continuous"
      source_repo:
        description: "GitHub repo with releases (used in full / pool-only)"
        required: false
        default: "xodiosx/termux-packages"
      clean_hf:
        description: "Wipe the whole HF repo before upload (full mode only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: regenerate-repo
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    env:
      HF_REPO: ${{ inputs.hf_repo_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
      SRC_REPO: ${{ inputs.source_repo }}
      MODE: ${{ inputs.mode }}
      REPOS_IN: ${{ inputs.repos }}
      CLEAN_HF: ${{ inputs.clean_hf }}

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils gzip jq
          pip install -q --upgrade "huggingface_hub<1.0"

      - name: Compute targets
        run: |
          set -euo pipefail
          mkdir -p work
          : > work/targets.txt
          : > work/dist-comp.txt
          for r in $(echo "$REPOS_IN" | tr ',' ' '); do
            r=$(echo "$r" | tr -d ' ')
            [ -z "$r" ] && continue
            case "$r" in
              main)
                echo "xodos-main" >> work/targets.txt
                echo "xodos-main stable main" >> work/dist-comp.txt
                ;;
              x11)
                echo "xodos-x11" >> work/targets.txt
                echo "xodos-x11 x11 main" >> work/dist-comp.txt
                ;;
              root)
                echo "xodos-root" >> work/targets.txt
                echo "xodos-root root stable" >> work/dist-comp.txt
                ;;
              glibc)
                echo "xodos-glibc" >> work/targets.txt
                echo "xodos-glibc glibc main" >> work/dist-comp.txt
                ;;
              tur)
                echo "xodos-tur" >> work/targets.txt
                echo "xodos-tur tur-packages tur" >> work/dist-comp.txt
                ;;
              tur-on-device)
                echo "xodos-tur" >> work/targets.txt
                echo "xodos-tur tur-packages tur-on-device" >> work/dist-comp.txt
                ;;
              tur-continuous)
                echo "xodos-tur" >> work/targets.txt
                echo "xodos-tur tur-packages tur-continuous" >> work/dist-comp.txt
                ;;
              *) echo "::error::Unknown repo: $r"; exit 1 ;;
            esac
          done
          sort -u work/targets.txt -o work/targets.txt
          sort -u work/dist-comp.txt -o work/dist-comp.txt
          echo ">>> Mode: $MODE"
          echo ">>> Targets:"
          sed 's/^/    /' work/targets.txt
          echo ">>> Dist/comp pairs:"
          sed 's/^/    /' work/dist-comp.txt

      - name: Wipe Hugging Face repo
        if: ${{ inputs.mode == 'full' && inputs.clean_hf }}
        run: |
          set -euo pipefail
          echo "::warning::clean_hf=true — DELETING entire HF repo before upload"
          cat > /tmp/wipe.py << 'PYEOF'
          import os
          from huggingface_hub import HfApi
          from huggingface_hub.utils import RepositoryNotFoundError
          api = HfApi()
          repo = os.environ["HF_REPO"]
          token = os.environ["HF_TOKEN"]
          try:
              api.delete_repo(repo_id=repo, repo_type="dataset", token=token)
              print(">>> deleted:", repo)
          except RepositoryNotFoundError:
              print(">>> repo did not exist")
          api.create_repo(repo_id=repo, repo_type="dataset", exist_ok=True, token=token)
          print(">>> recreated empty")
          PYEOF
          python3 /tmp/wipe.py

      - name: Download .deb from Hugging Face
        if: ${{ inputs.mode == 'metadata-only' }}
        run: |
          set -euo pipefail
          cat > /tmp/dl_hf.py << 'PYEOF'
          import os
          from huggingface_hub import snapshot_download
          targets = [l.strip() for l in open("work/targets.txt") if l.strip()]
          patterns = [t + "/pool/**" for t in targets]
          print(">>> patterns:", patterns)
          snapshot_download(
              repo_id=os.environ["HF_REPO"],
              repo_type="dataset",
              allow_patterns=patterns,
              local_dir="/tmp/hf-debs",
              token=os.environ.get("HF_TOKEN"),
              max_workers=8,
          )
          PYEOF
          python3 /tmp/dl_hf.py
          n=$(find /tmp/hf-debs -type f -name '*.deb' | wc -l)
          echo ">>> downloaded .deb: $n"
          [ "$n" -gt 0 ] || { echo "::error::no .deb from HF"; exit 1; }
          du -sh /tmp/hf-debs

      - name: Download .deb from GitHub Releases
        if: ${{ inputs.mode != 'metadata-only' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gh-debs
          mkdir -p /tmp/gh-debs
          download_tag() {
            local tag="$1" dest="$2"
            local attempt=1
            while [ "$attempt" -le 6 ]; do
              if gh release download "$tag" --repo "$SRC_REPO" \
                   --pattern "*.deb" --dir "$dest" 2>/tmp/gh_err.log; then
                return 0
              fi
              if grep -qiE 'rate limit|403|429|secondary' /tmp/gh_err.log; then
                echo "        rate limited (attempt $attempt/6), sleeping $((attempt*60))s"
                sleep $((attempt*60))
              else
                echo "        error (attempt $attempt/6), sleeping $((attempt*10))s"
                head -2 /tmp/gh_err.log | sed 's/^/            /' || true
                sleep $((attempt*10))
              fi
              attempt=$((attempt+1))
            done
            return 1
          }
          failed=""
          mapfile -t TAGS < <(
            gh release list --repo "$SRC_REPO" --limit 1000 \
              --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | .[].tagName | select(startswith("xodos-XoDos-"))'
          )
          : > work/tags-for-run.txt
          for tag in "${TAGS[@]}"; do
            for target in $(cat work/targets.txt); do
              short="${target#xodos-}"
              case "$short" in
                main)  pattern='^xodos-XoDos-main-p[0-9]+-' ;;
                x11)   pattern='^xodos-XoDos-x11-p[0-9]+-' ;;
                root)  pattern='^xodos-XoDos-root-p[0-9]+-' ;;
                glibc) pattern='^xodos-XoDos-glibc-p[0-9]+-' ;;
                tur)   pattern='^xodos-XoDos-tur-(continuous|on-device)-p[0-9]+-|^xodos-XoDos-tur-p[0-9]+-' ;;
              esac
              if echo "$tag" | grep -qE "$pattern"; then
                echo "$target|$tag" >> work/tags-for-run.txt
                break
              fi
            done
          done
          if [ ! -s work/tags-for-run.txt ]; then
            echo "::error::No matching tags for selected repos"
            exit 1
          fi
          echo ">>> tags to download:"
          sed 's/^/    /' work/tags-for-run.txt
          while IFS='|' read -r target tag; do
            [ -z "$tag" ] && continue
            echo ">>> $target / $tag"
            tmpdir=$(mktemp -d)
            if ! download_tag "$tag" "$tmpdir"; then
              echo "    FAIL: $tag"
              failed="$failed $tag"
              rm -rf "$tmpdir"
              continue
            fi
            n=$(find "$tmpdir" -maxdepth 1 -name '*.deb' | wc -l)
            echo "    got $n .deb"
            mkdir -p "/tmp/gh-debs/${target}"
            find "$tmpdir" -maxdepth 1 -name '*.deb' -print0 \
              | xargs -0r mv -t "/tmp/gh-debs/${target}/"
            rm -rf "$tmpdir"
            sleep 2
          done < work/tags-for-run.txt
          if [ -n "$failed" ]; then
            echo "::error::Failed tags:$failed"
            exit 1
          fi
          total=$(find /tmp/gh-debs -type f -name '*.deb' | wc -l)
          echo ">>> downloaded .deb: $total"
          du -sh /tmp/gh-debs

      - name: Stage pool tree
        if: ${{ inputs.mode != 'metadata-only' }}
        run: |
          set -euo pipefail
          POOL=/tmp/pool-tree
          rm -rf "$POOL"
          mkdir -p "$POOL"
          while IFS='|' read -r target tag; do
            [ -z "$tag" ] && continue
            comp=""
            case "$tag" in
              xodos-XoDos-main-p*)           comp=main ;;
              xodos-XoDos-x11-p*)            comp=main ;;
              xodos-XoDos-root-p*)           comp=stable ;;
              xodos-XoDos-glibc-p*)          comp=main ;;
              xodos-XoDos-tur-continuous-p*) comp=tur-continuous ;;
              xodos-XoDos-tur-on-device-p*)  comp=tur-on-device ;;
              xodos-XoDos-tur-p*)            comp=tur ;;
            esac
            [ -z "$comp" ] && continue
            src="/tmp/gh-debs/${target}"
            [ -d "$src" ] || continue
            shopt -s nullglob
            for deb in "$src"/*.deb; do
              [ -f "$deb" ] || continue
              pkg=$(dpkg-deb -f "$deb" Package 2>/dev/null || echo "")
              [ -z "$pkg" ] && continue
              fl=$(printf '%s' "$pkg" | cut -c1 | tr 'A-Z' 'a-z')
              dest="$POOL/${target}/pool/${comp}/${fl}/${pkg}"
              mkdir -p "$dest"
              cp -a "$deb" "$dest/" 2>/dev/null || true
            done
            shopt -u nullglob
          done < work/tags-for-run.txt
          echo ">>> .deb staged: $(find "$POOL" -type f -name '*.deb' | wc -l)"

      - name: Build dists metadata
        run: |
          set -euo pipefail
          BUILD=/tmp/aptrepo
          rm -rf "$BUILD"
          mkdir -p "$BUILD"
          if [ "$MODE" = "metadata-only" ]; then
            SRC_ROOT=/tmp/hf-debs
          else
            SRC_ROOT=/tmp/pool-tree
          fi
          echo ">>> SRC_ROOT=$SRC_ROOT"

          while read -r target dist comp; do
            [ -z "$target" ] && continue
            pooldir="$SRC_ROOT/${target}/pool/${comp}"
            if [ ! -d "$pooldir" ]; then
              echo ">>> skip $target/$comp (no pool)"
              continue
            fi
            outd="$BUILD/$target/dists/$dist/$comp/binary-aarch64"
            mkdir -p "$outd"
            : > "$outd/Packages"
            tsv="/tmp/t-${target}-${comp}.tsv"
            : > "$tsv"
            shopt -s nullglob
            for deb in "$pooldir"/*/*/*.deb; do
              dpkg-deb -I "$deb" >/dev/null 2>&1 || continue
              printf '%s\t%s\t%s\n' \
                "$(dpkg-deb -f "$deb" Package)" \
                "$(dpkg-deb -f "$deb" Version)" \
                "$deb" >> "$tsv"
            done
            shopt -u nullglob
            in_n=$(wc -l < "$tsv")
            echo ">>> $target/$comp: input=$in_n"
            [ "$in_n" -eq 0 ] && continue
            sort -t$'\t' -k1,1 -k2,2rV "$tsv" | awk -F'\t' '!seen[$1]++' > "${tsv}.w"
            placed=0
            while IFS=$'\t' read -r pkg ver deb; do
              [ -z "$pkg" ] && continue
              fname=$(basename "$deb")
              fl=$(printf '%s' "$pkg" | cut -c1 | tr 'A-Z' 'a-z')
              relpath="${target}/pool/${comp}/${fl}/${pkg}/${fname}"
              size=$(stat -c %s "$deb")
              md5=$(md5sum "$deb" | awk '{print $1}')
              sha1=$(sha1sum "$deb" | awk '{print $1}')
              sha256=$(sha256sum "$deb" | awk '{print $1}')
              dpkg-deb -f "$deb" >> "$outd/Packages"
              {
                echo "Filename: ${relpath}"
                echo "Size: ${size}"
                echo "MD5sum: ${md5}"
                echo "SHA1: ${sha1}"
                echo "SHA256: ${sha256}"
                echo ""
              } >> "$outd/Packages"
              placed=$((placed + 1))
            done < "${tsv}.w"
            echo "    placed: $placed"
            gzip -kf -9 "$outd/Packages"
            rm -f "$outd/Packages.xz" "$tsv" "${tsv}.w"
          done < work/dist-comp.txt

          cd "$BUILD"
          for target in $(cat work/targets.txt); do
            [ -d "$target/dists" ] || continue
            for dist_dir in "$target"/dists/*/; do
              [ -d "$dist_dir" ] || continue
              dist="$(basename "$dist_dir")"
              comps=""
              for comp_dir in "$dist_dir"*/; do
                [ -d "$comp_dir" ] || continue
                c="$(basename "$comp_dir")"
                [ -s "$comp_dir/binary-aarch64/Packages" ] && \
                  comps="${comps}${comps:+ }$c"
              done
              [ -z "$comps" ] && continue
              conf="/tmp/rel-${target}-${dist}.conf"
              {
                echo 'APT::FTPArchive::Release::Origin "xodos";'
                echo "APT::FTPArchive::Release::Label \"xodos ${target}/${dist}\";"
                echo "APT::FTPArchive::Release::Suite \"${dist}\";"
                echo "APT::FTPArchive::Release::Codename \"${dist}\";"
                echo 'APT::FTPArchive::Release::Architectures "aarch64";'
                echo "APT::FTPArchive::Release::Components \"${comps}\";"
                echo "APT::FTPArchive::Release::Description \"xodos ${target} (${dist})\";"
              } > "$conf"
              apt-ftparchive -c "$conf" release "$target/dists/$dist" \
                > "$target/dists/$dist/Release"
              cp "$target/dists/$dist/Release" "$target/dists/$dist/InRelease"
            done
          done
          echo ">>> dists tree:"
          find "$BUILD" -type f | sort | sed 's/^/    /'
          echo ">>> dists size: $(du -sh "$BUILD" | awk '{print $1}')"

      - name: Upload to Hugging Face
        run: |
          set -euo pipefail
          cat > /tmp/upload.py << 'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          repo = os.environ["HF_REPO"]
          token = os.environ["HF_TOKEN"]
          mode = os.environ["MODE"]
          api.create_repo(repo_id=repo, repo_type="dataset", exist_ok=True, token=token)
          print(">>> HF repo:", repo, "| mode:", mode)
          targets = [l.strip() for l in open("work/targets.txt") if l.strip()]

          if mode == "pool-only":
              for t in targets:
                  local_pool = "/tmp/pool-tree/" + t + "/pool"
                  if not os.path.isdir(local_pool):
                      print(">>> skip pool", t)
                      continue
                  print(">>> uploading", t + "/pool/ ...")
                  api.upload_large_folder(
                      folder_path=local_pool,
                      repo_id=repo,
                      repo_type="dataset",
                      path_in_repo=t + "/pool",
                      num_workers=4,
                  )
                  print(">>> uploaded", t + "/pool/")
              raise SystemExit(0)

          for t in targets:
              try:
                  api.delete_files(repo_id=repo, repo_type="dataset",
                                   delete_patterns=[t + "/dists/**"], token=token)
                  print(">>> cleared", t + "/dists/**")
              except Exception as e:
                  print(">>> WARN clear", t, type(e).__name__, e)

          if mode == "full":
              for t in targets:
                  local_pool = "/tmp/pool-tree/" + t + "/pool"
                  if not os.path.isdir(local_pool):
                      print(">>> skip pool", t)
                      continue
                  print(">>> uploading", t + "/pool/ ...")
                  api.upload_large_folder(
                      folder_path=local_pool,
                      repo_id=repo,
                      repo_type="dataset",
                      path_in_repo=t + "/pool",
                      num_workers=4,
                  )
                  print(">>> uploaded", t + "/pool/")

          for t in targets:
              local_dists = "/tmp/aptrepo/" + t + "/dists"
              if not os.path.isdir(local_dists):
                  print(">>> skip dists", t)
                  continue
              print(">>> uploading", t + "/dists/ ...")
              api.upload_folder(
                  folder_path=local_dists,
                  path_in_repo=t + "/dists",
                  repo_id=repo,
                  repo_type="dataset",
                  token=token,
                  commit_message="Regenerate " + t + " APT metadata",
              )
              print(">>> uploaded", t + "/dists/")
          print(">>> done")
          PYEOF
          python3 /tmp/upload.py

      - name: Verify URLs
        run: |
          set -euo pipefail
          base="https://huggingface.co/datasets/${HF_REPO}/resolve/main"
          fail=0
          while read -r target dist comp; do
            [ -z "$target" ] && continue
            for f in "Release" "InRelease" "${comp}/binary-aarch64/Packages.gz"; do
              url="${base}/${target}/dists/${dist}/${f}?t=$(date +%s)"
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
              printf '  %s  %s\n' "$code" "${target}/dists/${dist}/${f}"
              [ "$code" = "200" ] || fail=$((fail+1))
            done
          done < work/dist-comp.txt
          [ "$fail" -gt 0 ] && { echo "::error::$fail URLs unreachable"; exit 1; }
          echo ">>> all URLs OK"

      - name: Summary
        run: |
          {
            echo "## APT Repository Regenerated"
            echo ""
            echo "**Mode:** \`${{ inputs.mode }}\`"
            echo "**Repos:** \`${{ inputs.repos }}\`"
            echo "**clean_hf:** \`${{ inputs.clean_hf }}\`"
          } >> $GITHUB_STEP_SUMMARY
