name: Generate APT Metadata on Hugging Face

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repo that hosts release tags (owner/name)"
        required: true
        default: "xodiosx/termux-packages"
      hf_repo_id:
        description: "Hugging Face dataset repo (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      tags:
        description: "Space/comma tags. Empty = auto-discover all xodos-XoDos-*-p<N>-* tags."
        required: false
        default: ""
      repos:
        description: "Sub-repos to include (comma-separated)"
        required: false
        default: "main,x11,root,glibc,tur,tur-on-device,tur-continuous"

permissions:
  contents: read

jobs:
  generate-metadata:
    runs-on: ubuntu-24.04
    env:
      # Use the PAT for all GitHub reads — GITHUB_TOKEN hits 1000/hr
      GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
    steps:

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dpkg-dev apt-utils gzip jq
        pip install -q --upgrade "huggingface_hub<1.0"

    - name: Check GitHub API rate limit
      run: |
        set -euo pipefail
        limit=$(gh api rate_limit --jq '.resources.core.limit' 2>/dev/null || echo "unknown")
        remaining=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo "unknown")
        echo ">>> GitHub API limit: $limit requests/hour"
        echo ">>> Remaining:       $remaining"
        if [ "$limit" = "1000" ]; then
          echo "::warning::Using GITHUB_TOKEN (1000/hr). Downloads will likely fail."
          echo "::warning::Set GH_PUSH_TOKEN to a PAT with 5000/hr."
        fi

    - name: Resolve and group tags
      env:
        SRC: ${{ inputs.source_repo }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_REPOS: ${{ inputs.repos }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/plan
        : > /tmp/plan/groups.txt

        if [ -n "$INPUT_TAGS" ]; then
          read -a TAGS <<< "${INPUT_TAGS//,/ }"
        else
          REPOS_ALT=$(echo "$INPUT_REPOS" | tr ',' '|')
          mapfile -t TAGS < <(
            gh release list --repo "$SRC" --limit 1000 \
              --json tagName,createdAt \
              --jq "sort_by(.createdAt) | .[].tagName | select(test(\"^xodos-XoDos-(${REPOS_ALT})-p[0-9]+-\"))"
          )
        fi

        if [ "${#TAGS[@]}" -eq 0 ]; then
          echo "::error::No tags found"
          gh release list --repo "$SRC" --limit 30 || true
          exit 1
        fi

        for tag in "${TAGS[@]}"; do
          case "$tag" in
            xodos-XoDos-tur-continuous-p*) printf 'tur-continuous\t%s\n' "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-tur-on-device-p*)  printf 'tur-on-device\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-tur-p*)            printf 'tur\t%s\n'            "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-main-p*)           printf 'main\t%s\n'           "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-x11-p*)            printf 'x11\t%s\n'            "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-root-p*)           printf 'root\t%s\n'           "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-glibc-p*)          printf 'glibc\t%s\n'          "$tag" >> /tmp/plan/groups.txt ;;
            *) echo ">>> skipped: $tag" ;;
          esac
        done

        cut -f1 /tmp/plan/groups.txt | sort -u > /tmp/plan/repos.txt
        echo ">>> Repos present:"
        sed 's/^/    /' /tmp/plan/repos.txt

    # ==================================================================
    # Download with retry + fail-on-partial
    # ==================================================================
    - name: Download .deb from GitHub
      env:
        SRC: ${{ inputs.source_repo }}
      run: |
        set -euo pipefail
        rm -rf /tmp/raw-debs
        mkdir -p /tmp/raw-debs

        # Retry wrapper for gh release download
        download_tag() {
          local tag="$1" dest="$2"
          local attempt=1
          local max=6
          while [ "$attempt" -le "$max" ]; do
            if gh release download "$tag" --repo "$SRC" \
                 --pattern "*.deb" --dir "$dest" 2>/tmp/gh_err.log; then
              return 0
            fi
            if grep -qiE 'rate limit|403|429|secondary' /tmp/gh_err.log; then
              local backoff=$((attempt * 60))
              echo "        rate limited (attempt $attempt/$max), sleeping ${backoff}s"
              sleep "$backoff"
            else
              local backoff=$((attempt * 10))
              echo "        download error (attempt $attempt/$max), sleeping ${backoff}s"
              head -2 /tmp/gh_err.log | sed 's/^/            /' || true
              sleep "$backoff"
            fi
            attempt=$((attempt + 1))
          done
          return 1
        }

        failed_tags=""

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          echo ">>> repo: $repo"
          mkdir -p "/tmp/raw-debs/$repo"

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "    downloading: $tag"
            tmpdir=$(mktemp -d)
            if ! download_tag "$tag" "$tmpdir"; then
              echo "    FAIL: could not download $tag"
              failed_tags="$failed_tags $tag"
              rm -rf "$tmpdir"
              continue
            fi
            n=$(find "$tmpdir" -maxdepth 1 -type f -name '*.deb' | wc -l)
            echo "    got $n .deb"
            find "$tmpdir" -maxdepth 1 -type f -name '*.deb' -print0 \
              | xargs -0r mv -t "/tmp/raw-debs/$repo/"
            rm -rf "$tmpdir"
            sleep 2
          done < <(grep -P "^${repo}\t" /tmp/plan/groups.txt | cut -f2)

          total=$(find "/tmp/raw-debs/$repo" -maxdepth 1 -type f -name '*.deb' 2>/dev/null | wc -l)
          echo ">>> repo $repo: $total .deb total"
        done < /tmp/plan/repos.txt

        if [ -n "$failed_tags" ]; then
          echo ""
          echo "::error::These tags failed to download:"
          for t in $failed_tags; do
            echo "::error::    $t"
          done
          echo "::error::Rate limit? Wait 1 hour and retry, or set GH_PUSH_TOKEN to a PAT."
          exit 1
        fi

        echo ""
        echo ">>> raw-debs size: $(du -sh /tmp/raw-debs | awk '{print $1}')"

    # ==================================================================
    # Build local tree (dists + pool)
    # ==================================================================
    - name: Build local APT tree
      run: |
        set -euo pipefail
        BUILD=/tmp/aptrepo
        rm -rf "$BUILD"
        mkdir -p "$BUILD"

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          case "$repo" in
            main)           target=xodos-main;  dist=stable;       comp=main ;;
            x11)            target=xodos-x11;   dist=x11;          comp=main ;;
            root)           target=xodos-root;  dist=root;         comp=stable ;;
            glibc)          target=xodos-glibc; dist=glibc;        comp=main ;;
            tur)            target=xodos-tur;   dist=tur-packages; comp=tur ;;
            tur-on-device)  target=xodos-tur;   dist=tur-packages; comp=tur-on-device ;;
            tur-continuous) target=xodos-tur;   dist=tur-packages; comp=tur-continuous ;;
            *) continue ;;
          esac

          outd="$BUILD/$target/dists/$dist/$comp/binary-aarch64"
          pooldir="$BUILD/$target/pool/$comp"
          mkdir -p "$outd" "$pooldir"
          : > "$outd/Packages"

          tsv="/tmp/all-${repo}.tsv"
          : > "$tsv"
          shopt -s nullglob
          for deb in /tmp/raw-debs/"$repo"/*.deb; do
            dpkg-deb -I "$deb" >/dev/null 2>&1 || continue
            printf '%s\t%s\t%s\n' \
              "$(dpkg-deb -f "$deb" Package)" \
              "$(dpkg-deb -f "$deb" Version)" \
              "$deb" >> "$tsv"
          done
          shopt -u nullglob

          in_count=$(wc -l < "$tsv")
          echo ">>> $target: input=$in_count"
          [ "$in_count" -eq 0 ] && continue

          sort -t$'\t' -k1,1 -k2,2rV "$tsv" | awk -F'\t' '!seen[$1]++' > "/tmp/winners-${repo}.tsv"

          placed=0
          while IFS=$'\t' read -r pkg ver path; do
            [ -z "$pkg" ] && continue
            fname=$(basename "$path")
            first_letter=$(printf '%s' "$pkg" | cut -c1 | tr 'A-Z' 'a-z')
            rel_path="pool/${comp}/${first_letter}/${pkg}/${fname}"
            dest_dir="$pooldir/${first_letter}/${pkg}"
            mkdir -p "$dest_dir"
            mv "$path" "$dest_dir/"

            new_path="$dest_dir/$fname"
            size=$(stat -c %s "$new_path")
            md5=$(md5sum "$new_path" | awk '{print $1}')
            sha1=$(sha1sum "$new_path" | awk '{print $1}')
            sha256=$(sha256sum "$new_path" | awk '{print $1}')

            dpkg-deb -f "$new_path" >> "$outd/Packages"
            {
              echo "Filename: ${rel_path}"
              echo "Size: ${size}"
              echo "MD5sum: ${md5}"
              echo "SHA1: ${sha1}"
              echo "SHA256: ${sha256}"
              echo ""
            } >> "$outd/Packages"
            placed=$((placed + 1))
          done < "/tmp/winners-${repo}.tsv"
          echo "    placed: $placed"
          gzip -kf -9 "$outd/Packages"
          rm -f "$outd/Packages.xz" "$tsv" "/tmp/winners-${repo}.tsv"
        done < /tmp/plan/repos.txt

        echo ">>> aptrepo: $(du -sh "$BUILD" | awk '{print $1}')"
        echo ">>> .deb total: $(find "$BUILD" -type f -name '*.deb' | wc -l)"

    - name: Generate Release files
      run: |
        set -euo pipefail
        BUILD=/tmp/aptrepo
        cd "$BUILD"

        for target in xodos-main xodos-x11 xodos-root xodos-glibc xodos-tur; do
          [ -d "$target/dists" ] || continue
          for dist_dir in "$target"/dists/*/; do
            [ -d "$dist_dir" ] || continue
            dist="$(basename "$dist_dir")"
            comps=""
            for comp_dir in "$dist_dir"*/; do
              [ -d "$comp_dir" ] || continue
              comp="$(basename "$comp_dir")"
              if [ -d "$comp_dir/binary-aarch64" ] && [ -s "$comp_dir/binary-aarch64/Packages" ]; then
                comps="${comps}${comps:+ }$comp"
              fi
            done
            [ -z "$comps" ] && continue

            conf="/tmp/release-${target}-${dist}.conf"
            {
              echo 'APT::FTPArchive::Release::Origin "xodos";'
              echo "APT::FTPArchive::Release::Label \"xodos ${target}/${dist}\";"
              echo "APT::FTPArchive::Release::Suite \"${dist}\";"
              echo "APT::FTPArchive::Release::Codename \"${dist}\";"
              echo 'APT::FTPArchive::Release::Architectures "aarch64";'
              echo "APT::FTPArchive::Release::Components \"${comps}\";"
              echo "APT::FTPArchive::Release::Description \"xodos ${target} (${dist})\";"
            } > "$conf"
            apt-ftparchive -c "$conf" release "$target/dists/$dist" > "$target/dists/$dist/Release"
            cp "$target/dists/$dist/Release" "$target/dists/$dist/InRelease"
          done
        done

    # ==================================================================
    # Upload — clear only dists/, upload everything
    # ==================================================================
    - name: Upload to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: ${{ inputs.hf_repo_id }}
      run: |
        set -euo pipefail
        python3 -c "
        import os
        from huggingface_hub import HfApi
        api = HfApi()
        repo = os.environ['HF_REPO']
        api.create_repo(repo_id=repo, repo_type='dataset', exist_ok=True)

        targets = ['xodos-main', 'xodos-x11', 'xodos-root', 'xodos-glibc', 'xodos-tur']
        for t in targets:
            try:
                api.delete_files(repo_id=repo, repo_type='dataset',
                                 delete_patterns=[t + '/dists/**'])
                print('>>> cleared', t + '/dists/**')
            except Exception as e:
                print('>>> skip clear', t, type(e).__name__)

        print('>>> uploading /tmp/aptrepo ...')
        api.upload_large_folder(folder_path='/tmp/aptrepo',
                                 repo_id=repo, repo_type='dataset', num_workers=4)
        print('>>> done')
        "

    - name: Summary
      run: |
        {
          echo "## APT Repositories Published"
          echo ""
          echo "Base: \`https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main\`"
          echo ""
          echo '```'
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-main stable main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-x11 x11 main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-root root stable"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-glibc glibc main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/xodos-tur tur-packages tur tur-on-device tur-continuous"
          echo '```'
        } >> $GITHUB_STEP_SUMMARY
