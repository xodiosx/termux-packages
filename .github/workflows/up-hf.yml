name: Fix Missing Packages in GitHub Releases

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repo hosting releases (owner/name)"
        required: true
        default: "xodiosx/termux-packages"
      repos:
        description: "Repos to check (comma-separated)"
        required: true
        default: "main,x11,root,glibc,tur,tur-on-device,tur-continuous"
      arch:
        description: "Architecture"
        required: false
        default: "aarch64"
      dry_run:
        description: "Only report missing packages (no downloads, no uploads)"
        type: boolean
        default: true
      max_per_repo:
        description: "Max missing packages per repo (0 = no limit)"
        required: false
        default: "500"
      upload_tag_suffix:
        description: "Part number for the fix release (default p99)"
        required: false
        default: "p99"
      dists_fallback_repo:
        description: "GitHub repo holding dists fallback release assets"
        required: false
        default: "termux-user-repository/dists"
      dists_fallback_tag:
        description: "Release tag in the dists fallback repo"
        required: false
        default: "0.1"

permissions:
  contents: write

concurrency:
  group: fix-missing-packages
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SRC_REPO: ${{ inputs.source_repo }}
      REPOS_IN: ${{ inputs.repos }}
      ARCH: ${{ inputs.arch }}
      DRY_RUN: ${{ inputs.dry_run }}
      MAX_PER_REPO: ${{ inputs.max_per_repo }}
      UPLOAD_SUFFIX: ${{ inputs.upload_tag_suffix }}
      DISTS_REPO: ${{ inputs.dists_fallback_repo }}
      DISTS_TAG: ${{ inputs.dists_fallback_tag }}

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils xz-utils zstd dpkg-dev perl curl jq

      - name: Compute repo URLs
        run: |
          set -euo pipefail
          mkdir -p work
          : > work/repo-urls.txt
          for r in $(echo "$REPOS_IN" | tr ',' ' '); do
            r=$(echo "$r" | tr -d ' ')
            [ -z "$r" ] && continue
            case "$r" in
              main)   printf 'main\thttps://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages\thttps://packages-cf.termux.dev/apt/termux-main\n' >> work/repo-urls.txt ;;
              x11)    printf 'x11\thttps://packages-cf.termux.dev/apt/termux-x11/dists/x11/main/binary-aarch64/Packages\thttps://packages-cf.termux.dev/apt/termux-x11\n' >> work/repo-urls.txt ;;
              root)   printf 'root\thttps://packages-cf.termux.dev/apt/termux-root/dists/root/stable/binary-aarch64/Packages\thttps://packages-cf.termux.dev/apt/termux-root\n' >> work/repo-urls.txt ;;
              glibc)  printf 'glibc\thttps://packages-cf.termux.dev/apt/termux-glibc/dists/glibc/stable/binary-aarch64/Packages\thttps://packages-cf.termux.dev/apt/termux-glibc\n' >> work/repo-urls.txt ;;
              tur)    printf 'tur\thttps://tur.kcubeterm.com/dists/tur-packages/tur/binary-aarch64/Packages\thttps://tur.kcubeterm.com\n' >> work/repo-urls.txt ;;
              tur-on-device) printf 'tur-on-device\thttps://tur.kcubeterm.com/dists/tur-packages/tur-on-device/binary-aarch64/Packages\thttps://tur.kcubeterm.com\n' >> work/repo-urls.txt ;;
              tur-continuous) printf 'tur-continuous\thttps://tur.kcubeterm.com/dists/tur-packages/tur-continuous/binary-aarch64/Packages\thttps://tur.kcubeterm.com\n' >> work/repo-urls.txt ;;
              *) echo "::warning::Unknown repo: $r" ;;
            esac
          done
          echo ">>> Repos to process:"
          awk -F'\t' '{print "    " $1}' work/repo-urls.txt

      # ── NEW: prefetch the dists release asset list once ──
      - name: Fetch dists fallback assets
        run: |
          set -euo pipefail
          mkdir -p work
          echo ">>> fetching fallback assets from $DISTS_REPO @ $DISTS_TAG"
          if gh release view "$DISTS_TAG" --repo "$DISTS_REPO" --json assets \
               --jq '.assets[].name' > work/dists-assets.txt 2>/dev/null; then
            n=$(wc -l < work/dists-assets.txt)
            echo ">>>   fallback assets available: $n"
            head -5 work/dists-assets.txt | sed 's/^/    /'
          else
            echo "::warning::could not fetch fallback assets from $DISTS_REPO — fallback disabled"
            : > work/dists-assets.txt
          fi
      # ──────────────────────────────────────────────────────

      - name: Compute per-repo diffs
        run: |
          set -euo pipefail
          : > work/missing-report.txt
          : > work/missing-urls.txt

          echo ">>> fetching all release tags from $SRC_REPO ..."
          gh api --paginate --slurp "repos/$SRC_REPO/releases?per_page=100" \
            | jq -r '.[][] | .tag_name' > work/all-tags.txt
          echo ">>> total releases: $(wc -l < work/all-tags.txt)"

          while IFS=$'\t' read -r repo packages_url base_url; do
            [ -z "$repo" ] && continue
            echo "=================================================="
            echo ">>> repo: $repo"
            echo "=================================================="

            grep -E "^xodos-XoDos-${repo}-p[0-9]+-" work/all-tags.txt \
              | sort -u > "work/tags-$repo.txt"
            echo ">>>   tags found for $repo: $(wc -l < "work/tags-$repo.txt")"

            : > "work/existing-$repo.txt"
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              gh release view "$tag" --repo "$SRC_REPO" \
                --json assets --jq '.assets[]?.name' \
                >> "work/existing-$repo.txt" 2>/dev/null || true
            done < "work/tags-$repo.txt"

            awk -F'_' 'NF>=3 {print $1}' "work/existing-$repo.txt" | sort -u \
              > "work/existing-pkgs-$repo.txt"
            echo ">>>   existing packages in $repo: $(wc -l < "work/existing-pkgs-$repo.txt")"

            echo ">>> fetching official Packages for '$repo'..."
            if ! curl -fsSL --retry 4 --retry-delay 2 --max-time 180 \
                   -o "work/Packages-$repo" "$packages_url"; then
              echo ">>> WARN: cannot fetch $packages_url — skipping $repo"
              continue
            fi

            awk -v base="$base_url" '
              BEGIN { pkg=""; fname="" }
              /^Package: /  { pkg = substr($0, 10) }
              /^Filename: / { fname = substr($0, 11) }
              /^$/ {
                if (pkg != "" && fname != "") {
                  if (fname ~ /_aarch64\.deb$/ || fname ~ /_all\.deb$/) {
                    gsub(/\/$/, "", base)
                    if (fname ~ /^https?:\/\//) print pkg "\t" fname
                    else print pkg "\t" base "/" fname
                  }
                }
                pkg=""; fname=""
              }
              END {
                if (pkg != "" && fname != "") {
                  if (fname ~ /_aarch64\.deb$/ || fname ~ /_all\.deb$/) {
                    gsub(/\/$/, "", base)
                    if (fname ~ /^https?:\/\//) print pkg "\t" fname
                    else print pkg "\t" base "/" fname
                  }
                }
              }
            ' "work/Packages-$repo" > "work/official-$repo.txt"

            awk -F'\t' '{print $1}' "work/official-$repo.txt" | sort -u \
              > "work/official-pkgs-$repo.txt"
            echo ">>>   official packages in $repo: $(wc -l < "work/official-pkgs-$repo.txt")"

            comm -23 "work/official-pkgs-$repo.txt" "work/existing-pkgs-$repo.txt" \
              > "work/missing-$repo.txt"
            missing_count=$(wc -l < "work/missing-$repo.txt")
            echo ">>>   MISSING in $repo: $missing_count"

            if [ "$missing_count" -eq 0 ]; then
              echo ""
              echo "### $repo — ✅ nothing missing" >> work/missing-report.txt
              continue
            fi

            {
              echo ""
              echo "### $repo — ❌ $missing_count missing packages"
              head -60 "work/missing-$repo.txt" | sed 's/^/    /'
              [ "$missing_count" -gt 60 ] && echo "    ... and $((missing_count - 60)) more"
            } >> work/missing-report.txt

            awk -F'\t' 'NR==FNR { want[$1]=1; next } want[$1] { print $2 }' \
              "work/missing-$repo.txt" "work/official-$repo.txt" \
              > "work/missing-urls-$repo.txt"

            if [ "$MAX_PER_REPO" != "0" ]; then
              head -n "$MAX_PER_REPO" "work/missing-urls-$repo.txt" > /tmp/lim.txt
              mv /tmp/lim.txt "work/missing-urls-$repo.txt"
            fi

            echo ">>>   URLs to fetch: $(wc -l < "work/missing-urls-$repo.txt")"
            awk -v r="$repo" '{print r "\t" $0}' "work/missing-urls-$repo.txt" \
              >> work/missing-urls.txt
          done < work/repo-urls.txt

          echo ""
          echo "=================================================="
          echo ">>> TOTAL URLs queued for patching: $(wc -l < work/missing-urls.txt)"
          echo "=================================================="

      - name: Show report
        run: |
          set -euo pipefail
          echo "===================================================================="
          echo ">>> MISSING PACKAGES REPORT"
          echo "===================================================================="
          cat work/missing-report.txt
          echo ""
          echo "===================================================================="
          echo ">>> DRY_RUN = $DRY_RUN"
          if [ "$DRY_RUN" = "true" ]; then
            echo ">>> This was a report-only run. No downloads, no uploads."
          fi
          echo "===================================================================="

      - name: Download and patch
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          mkdir -p work/patched work/tmp
          : > work/failures.log
          : > work/outcomes.log

          cat > /tmp/patch_one.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          set -x

          src="$1"; dst="$2"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          if [ -e "$dst" ]; then
            if dpkg-deb -I "$dst" >/dev/null 2>&1; then echo "OK-CACHED"; exit 0; fi
            rm -f "$dst"
          fi

          magic="$(head -c 8 "$src")"
          if [ "$magic" != "!<arch>" ]; then
            echo "NOT-A-DEB" >&2
            cp -a "$src" "$dst"
            echo "UNPATCHED-COPIED"
            exit 0
          fi

          if ! dpkg-deb -R "$src" "$tmp" 2>/tmp/dpkg-err.$$; then
            echo "EXTRACT-FAIL" >&2
            cat /tmp/dpkg-err.$$ >&2
            rm -f /tmp/dpkg-err.$$
            cp -a "$src" "$dst"
            echo "UNPATCHED-COPIED"
            exit 0
          fi
          rm -f /tmp/dpkg-err.$$

          [ -d "$tmp/data/data/com.termux" ] && mv "$tmp/data/data/com.termux" "$tmp/data/data/app.xodos2"

          while IFS= read -r -d '' link; do
            t="$(readlink "$link" 2>/dev/null || true)"
            case "$t" in *com.termux*) ln -sfn "${t//com.termux/app.xodos2}" "$link" || true ;; esac
          done < <(find "$tmp" -type l -print0 2>/dev/null || true)

          while IFS= read -r -d '' f; do
            case "$f" in
              *.gz|*.xz|*.zst|*.bz2|*.lz4|*.lzma|*.zip|*.jar|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico) continue ;;
            esac
            if grep -qa 'com\.termux' "$f" 2>/dev/null; then
              perl -0777 -i -pe 's{com\.termux}{app.xodos2}g' "$f" 2>/dev/null || true
            fi
          done < <(find "$tmp" -type f -print0 2>/dev/null || true)

          if [ -d "$tmp/DEBIAN" ]; then
            for s in preinst postinst prerm postrm config; do
              [ -f "$tmp/DEBIAN/$s" ] && chmod 0755 "$tmp/DEBIAN/$s" || true
            done
            for s in control conffiles md5sums shlibs symbols templates triggers; do
              [ -f "$tmp/DEBIAN/$s" ] && chmod 0644 "$tmp/DEBIAN/$s" || true
            done
          fi

          if [ -f "$tmp/DEBIAN/conffiles" ]; then
            : > "$tmp/DEBIAN/conffiles.new"
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in
                ""|\#*) printf '%s\n' "$line" >> "$tmp/DEBIAN/conffiles.new"; continue ;;
              esac
              rel="${line#/}"
              if [ -e "$tmp/$rel" ] || [ -L "$tmp/$rel" ]; then
                printf '%s\n' "$line" >> "$tmp/DEBIAN/conffiles.new"
              fi
            done < "$tmp/DEBIAN/conffiles"
            mv "$tmp/DEBIAN/conffiles.new" "$tmp/DEBIAN/conffiles"
          fi

          # guard: meta-packages have no data/ dir
          if [ -d "$tmp/data" ]; then
            find "$tmp/data" -type d -print0 2>/dev/null \
              | while IFS= read -r -d '' d; do
                  cur="$(stat -c '%a' "$d" 2>/dev/null || echo 755)"
                  if [ $((0$cur & 0700)) -ne 0700 ]; then chmod u+rwx "$d" 2>/dev/null || true; fi
                done
          fi

          if dpkg-deb --root-owner-group -b "$tmp" "$dst" >/dev/null 2>&1; then echo "OK"; exit 0; fi
          rm -f "$dst"
          if dpkg-deb --root-owner-group -Zgzip -b "$tmp" "$dst" >/dev/null 2>&1; then echo "OK-FALLBACK-GZIP"; exit 0; fi
          rm -f "$dst"
          if dpkg-deb -b "$tmp" "$dst" >/dev/null 2>&1; then echo "OK-FALLBACK-NOROG"; exit 0; fi
          rm -f "$dst"
          cp -a "$src" "$dst"
          echo "UNPATCHED-COPIED"
          exit 0
          EOS
          chmod +x /tmp/patch_one.sh

          # ── MODIFIED: try primary URL, then fall back to the dists GitHub release ──
          cat > /tmp/dl_and_patch.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail

          line="$1"
          repo="${line%%$'\t'*}"
          url="${line#*$'\t'}"
          if [ -z "$repo" ] || [ -z "$url" ]; then
            echo "BAD-LINE: $line" >&2
            exit 0
          fi

          outdir="work/patched/$repo"
          mkdir -p "$outdir"

          enc="$(basename "$url")"
          fn="$(printf '%s' "$enc" | perl -pe 's/%([0-9A-Fa-f]{2})/chr(hex($1))/ge')"
          tmpfile="work/tmp/$fn"
          outfile="$outdir/$fn"

          [ -s "$outfile" ] && exit 0

          assets_file="${GITHUB_WORKSPACE:-$PWD}/work/dists-assets.txt"
          dl_ok=0

          # 1) primary URL from the Packages index
          if curl -fsSL --retry 3 --retry-delay 2 --max-time 600 \
               -o "$tmpfile" "$url" 2>/tmp/curl-err.$$; then
            dl_ok=1
          else
            # 2) fallback: match the asset in the dists GitHub release.
            #    Index filenames use epoch ':' but GitHub asset names use '.'
            #    (colons aren't allowed in release asset filenames).
            if [ -s "$assets_file" ]; then
              gh_name="${fn//:/.}"
              if grep -Fxq "$gh_name" "$assets_file"; then
                fb_url="https://github.com/${DISTS_REPO}/releases/download/${DISTS_TAG}/${gh_name}"
                echo ">>> FALLBACK $repo: $fn -> $gh_name" >&2
                if curl -fsSL --retry 3 --retry-delay 2 --max-time 600 \
                     -o "$tmpfile" "$fb_url" 2>/tmp/curl-err2.$$; then
                  dl_ok=1
                fi
              else
                echo ">>> no fallback asset for $fn" >&2
              fi
            fi
          fi

          if [ "$dl_ok" -ne 1 ]; then
            echo "DL-FAIL $repo/$fn" >> work/failures.log
            cat /tmp/curl-err.$$ >&2 2>/dev/null || true
            cat /tmp/curl-err2.$$ >&2 2>/dev/null || true
            rm -f /tmp/curl-err.$$ /tmp/curl-err2.$$ "$tmpfile"
            exit 0
          fi
          rm -f /tmp/curl-err.$$ /tmp/curl-err2.$$

          outcome="$(/tmp/patch_one.sh "$tmpfile" "$outfile" 2>/tmp/patch-err.$$ | tail -1 || echo "FAIL-UNKNOWN")"
          if [ "$outcome" = "FAIL-UNKNOWN" ]; then
            echo "PATCH-FAIL $repo/$fn" >> work/failures.log
            cat /tmp/patch-err.$$ >&2
          fi
          rm -f /tmp/patch-err.$$
          rm -f "$tmpfile"
          [ -z "$outcome" ] && outcome="OK"
          printf '%s\t%s\t%s\n' "$repo" "$outcome" "$fn" >> work/outcomes.log
          [ ! -s "$outfile" ] && echo "FAIL $repo/$fn" >> work/failures.log
          exit 0
          EOS
          chmod +x /tmp/dl_and_patch.sh

          total=$(wc -l < work/missing-urls.txt)
          echo ">>> downloading + patching $total files (6 parallel) ..."
          xargs -a work/missing-urls.txt -P 6 -I{} bash /tmp/dl_and_patch.sh {} || true

          echo ""
          echo ">>> outcome summary:"
          if [ -s work/outcomes.log ]; then
            awk -F'\t' '{print $2}' work/outcomes.log | sort | uniq -c | sort -rn
          fi
          echo ">>> failure count: $(wc -l < work/failures.log)"
          if [ -s work/failures.log ]; then
            echo ">>> hard failures (first 20):"
            head -20 work/failures.log
          fi
          echo ">>> per-repo produced:"
          for d in work/patched/*/; do
            [ -d "$d" ] && echo "    $(basename "$d"): $(find "$d" -maxdepth 1 -name '*.deb' | wc -l)"
          done

      - name: Upload fix releases
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          TS=$(date -u +'%Y.%m.%d-%H%M%S')
          for repo_dir in work/patched/*/; do
            [ -d "$repo_dir" ] || continue
            repo=$(basename "$repo_dir")
            mapfile -t files < <(find "$repo_dir" -maxdepth 1 -name '*.deb' -printf '%p\n' | sort)
            n="${#files[@]}"
            if [ "$n" -eq 0 ]; then
              echo ">>> no files for repo $repo — skipping"
              continue
            fi
            tag="xodos-XoDos-${repo}-${UPLOAD_SUFFIX}-${TS}"
            echo "=================================================="
            echo ">>> creating release: $tag ($n files)"
            echo "=================================================="
            if ! gh release view "$tag" --repo "$SRC_REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$SRC_REPO" \
                --title "XoDos ${repo} fix release — ${TS}" \
                --notes "Missing packages for **${repo}** discovered on $(date -u +'%Y-%m-%d %H:%M:%S UTC')." \
                --target "$(gh api "repos/$SRC_REPO" --jq .default_branch)"
            fi
            i=0; failed=0
            while [ "$i" -lt "$n" ]; do
              batch_end=$((i + 20))
              [ "$batch_end" -gt "$n" ] && batch_end="$n"
              batch=( "${files[@]:i:batch_end-i}" )
              if gh release upload "$tag" "${batch[@]}" --repo "$SRC_REPO" --clobber 2>/tmp/gh_err.log; then
                i="$batch_end"
                echo "  [$i/$n] uploaded"
              else
                echo "  batch failed: $(head -2 /tmp/gh_err.log)"
                failed=$((failed + batch_end - i))
                i="$batch_end"
              fi
              sleep 1
            done
            echo ">>> $tag: uploaded $((n - failed))/$n files"
          done

      - name: Final summary
        if: always()
        run: |
          {
            echo "## Fix Missing Packages — report"
            echo ""
            echo "**Dry run:** \`${{ inputs.dry_run }}\`"
            echo "**Repos checked:** \`${{ inputs.repos }}\`"
            echo ""
            cat work/missing-report.txt 2>/dev/null || true
            if [ "${{ inputs.dry_run }}" = "false" ]; then
              echo ""
              echo "### Produced fixes"
              echo '```'
              for d in work/patched/*/; do
                [ -d "$d" ] && echo "$(basename "$d"): $(find "$d" -maxdepth 1 -name '*.deb' | wc -l) files"
              done
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
